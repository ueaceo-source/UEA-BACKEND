/* ───────── CALENDAR ───────── */
var CAL={mode:null, ref:null, sel:null, tech:''};
function isoOf(d){ return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function parseIso(s){ var p=s.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); }
function addDays(s,n){ var d=parseIso(s); d.setUTCDate(d.getUTCDate()+n); return isoOf(d); }
function todayIso(){ return new Date().toLocaleDateString('en-CA',{timeZone:'America/Chicago'}); }
function minLabel(m){ if(m==null) return ''; var h=Math.floor(m/60), mm=m%60; return ((h%12)||12)+(mm?':'+String(mm).padStart(2,'0'):'')+(h<12?' AM':' PM'); }
function calRange(){
  var r=parseIso(CAL.ref);
  if(CAL.mode==='week'){ var s=addDays(CAL.ref, -r.getUTCDay()); return {from:s, to:addDays(s,6), first:s, days:7}; }
  var first=isoOf(new Date(Date.UTC(r.getUTCFullYear(), r.getUTCMonth(), 1)));
  var start=addDays(first, -parseIso(first).getUTCDay());
  return {from:start, to:addDays(start,41), first:first, days:42};
}
VIEWS.calendar=function(){
  if(!CAL.ref){ CAL.ref=todayIso(); CAL.sel=CAL.ref; }
  if(!CAL.mode) CAL.mode=PHONE()?'month':'month';
  var rg=calRange(), r=parseIso(CAL.mode==='week'?rg.from:rg.first);
  var title=CAL.mode==='week'
    ? dayLabel(rg.from).replace(/^\w+, /,'')+' – '+dayLabel(rg.to).replace(/^\w+, /,'')
    : r.toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'});
  $('#view').innerHTML='<div class="calhead"><h2 style="margin:0">Calendar</h2>'+
      '<div class="row" style="gap:.35rem"><button class="btn ghost sm" id="calSub">Add to my phone</button>'+
      (DESK()?'<select id="calTech" style="width:auto"><option value="">Everyone</option><option value="none">Unassigned</option></select>':'')+'</div></div>'+
    '<div class="calbar"><div class="row" style="gap:.3rem"><button class="btn ghost sm" id="calPrev" aria-label="Previous">‹</button><button class="btn ghost sm" id="calToday">Today</button><button class="btn ghost sm" id="calNext" aria-label="Next">›</button></div>'+
      '<div class="caltitle">'+esc(title)+'</div>'+
      '<div class="seg calmode"><button class="'+(CAL.mode==='month'?'on na':'')+'" data-cm="month">Month</button><button class="'+(CAL.mode==='week'?'on na':'')+'" data-cm="week">Week</button></div></div>'+
    '<div id="calUnsched"></div><div id="calSubBox"></div><div id="calGrid" class="steel"><div class="empty">Loading…</div></div><div id="calDay"></div>';
  $('#calPrev').addEventListener('click', function(){ step(-1); });
  $('#calNext').addEventListener('click', function(){ step(1); });
  $('#calToday').addEventListener('click', function(){ CAL.ref=todayIso(); CAL.sel=CAL.ref; VIEWS.calendar(); });
  $$('[data-cm]').forEach(function(b){ b.addEventListener('click', function(){ CAL.mode=b.dataset.cm; CAL.ref=CAL.sel||CAL.ref; VIEWS.calendar(); }); });
  $('#calSub').addEventListener('click', showSub);
  if($('#calTech')){
    api('/admin/techs').then(function(d){ $('#calTech').insertAdjacentHTML('beforeend', d.techs.map(function(t){ return '<option value="'+t.id+'">'+esc(t.name)+'</option>'; }).join('')); $('#calTech').value=CAL.tech; });
    $('#calTech').addEventListener('change', function(){ CAL.tech=this.value; load(); });
  }
  function step(n){
    if(CAL.mode==='week'){ CAL.ref=addDays(CAL.ref, 7*n); }
    else { var d=parseIso(CAL.ref); CAL.ref=isoOf(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+n, 1))); }
    CAL.sel=CAL.ref; VIEWS.calendar();
  }
  function load(){
    api('/admin/calendar?from='+rg.from+'&to='+rg.to+'&tech='+encodeURIComponent(CAL.tech)).then(function(d){
      var by={}; d.jobs.forEach(function(j){ (by[j.date]=by[j.date]||[]).push(j); });
      CAL.by=by; CAL.today=d.today;
      $('#calUnsched').innerHTML=d.unscheduled?'<button class="cnote unsched" id="calUn"><b>'+d.unscheduled+'</b> open job'+(d.unscheduled>1?'s':'')+' not on the calendar yet. Tap to schedule.</button>':'';
      if($('#calUn')) $('#calUn').addEventListener('click', function(){ S.jobsView='board'; S.stageF='new'; go('jobs'); });
      paintGrid(); paintDay();
    }).catch(function(e){ $('#calGrid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
  }
  function chip(j){
    var cls=j.status==='paid'?'done':(j.stage==='completed'?'done':(['en_route','on_site','in_progress'].indexOf(j.stage)>-1?'live':(j.rush?'rush':'')));
    return '<button class="cev '+cls+'" data-cj="'+j.id+'"><span>'+esc(j.start_min!=null?minLabel(j.start_min):'Any')+'</span> '+esc(j.customer_name||'Customer')+'</button>';
  }
  function paintGrid(){
    var h='<div class="cgrid '+CAL.mode+'">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(w){ return '<div class="cdow">'+w+'</div>'; }).join('');
    var month=parseIso(rg.first).getUTCMonth();
    for(var i=0;i<rg.days;i++){
      var day=addDays(rg.from,i), jobs=CAL.by[day]||[], dd=parseIso(day);
      var max=PHONE()?0:(CAL.mode==='week'?20:3);
      h+='<div class="cday'+(dd.getUTCMonth()!==month&&CAL.mode==='month'?' out':'')+(day===CAL.today?' today':'')+(day===CAL.sel?' sel':'')+'" data-cd="'+day+'" role="button" tabindex="0" aria-label="'+esc(dayLabel(day))+', '+jobs.length+' job'+(jobs.length===1?'':'s')+'">'+
        '<div class="cnum">'+dd.getUTCDate()+'</div>'+
        (max?jobs.slice(0,max).map(chip).join('')+(jobs.length>max?'<div class="cmore">+'+(jobs.length-max)+' more</div>':''):(jobs.length?'<div class="cdots">'+jobs.slice(0,4).map(function(){ return '<i></i>'; }).join('')+(jobs.length>4?'<b>+</b>':'')+'</div>':''))+
        '</div>';
    }
    $('#calGrid').innerHTML=h+'</div>';
    $$('#calGrid [data-cd]').forEach(function(c){
      var pick=function(e){ if(e.target.closest('[data-cj]')) return; CAL.sel=c.dataset.cd; $$('#calGrid .cday').forEach(function(x){ x.classList.toggle('sel', x===c); }); paintDay(); if(PHONE()) $('#calDay').scrollIntoView({behavior:'smooth',block:'start'}); };
      c.addEventListener('click', pick); c.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(e); } });
    });
    $$('#calGrid [data-cj]').forEach(function(b){ b.addEventListener('click', function(){ openJob(b.dataset.cj); }); });
  }
  function paintDay(){
    var day=CAL.sel; if(!day||!CAL.by) return;
    var jobs=CAL.by[day]||[];
    var hrs=jobs.filter(function(j){ return j.status!=='paid'; }).reduce(function(a,j){ return a+j.hours; },0);
    $('#calDay').innerHTML='<div class="dayhead"><h3>'+esc(dayLabel(day))+(day===CAL.today?' <span class="chip gold">Today</span>':'')+'</h3>'+
        '<span class="help">'+(jobs.length?jobs.length+' job'+(jobs.length>1?'s':'')+(hrs?' · about '+(Math.round(hrs*10)/10)+' hr of work':''):'Nothing booked')+'</span></div>'+
      (jobs.length?jobs.map(function(j){
        return '<button class="card cjob" data-cj="'+j.id+'"><div class="ctime">'+esc(j.start_min!=null?minLabel(j.start_min):(j.window||'Any time'))+'<small>'+(Math.round(j.hours*10)/10)+' hr</small></div>'+
          '<div><div class="t">'+esc(j.customer_name||'Customer')+' '+stageChip(j)+(j.rush?' <span class="chip bad">Rush</span>':'')+'</div>'+
          '<div class="s">'+esc(j.service||'No service listed')+(j.vehicle?' · '+esc(j.vehicle):'')+'</div>'+
          '<div class="s">'+(j.address?esc(j.address)+' · ':'')+(j.tech?esc(j.tech.name):'<span style="color:var(--warn)">No tech</span>')+'</div></div></button>';
      }).join(''):'')+
      (DESK()?'<button class="btn ghost sm" id="calNew" style="margin-top:.4rem">+ New job on '+esc(dayLabel(day))+'</button>':'');
    $$('#calDay [data-cj]').forEach(function(b){ b.addEventListener('click', function(){ openJob(b.dataset.cj); }); });
    if($('#calNew')) $('#calNew').addEventListener('click', function(){ S.prefill={sched_date:day}; go('new'); });
  }
  function showSub(){
    var box=$('#calSubBox'); if(box.innerHTML){ box.innerHTML=''; return; }
    box.innerHTML='<div class="steel panel sec"><div class="empty">Loading…</div></div>';
    api('/admin/calendar/feed').then(function(d){
      box.innerHTML='<div class="steel panel sec"><h3>See jobs in your phone\'s calendar</h3>'+
        '<p class="help" style="margin-top:-.4rem">Shows '+esc(d.scope)+'. New and changed jobs show up on their own within about 15 minutes (Google can take a few hours).</p>'+
        '<div class="row" style="gap:.4rem"><a class="btn" href="'+esc(d.webcal)+'">iPhone: add calendar</a>'+
        '<a class="btn ghost" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/u/0/r?cid='+encodeURIComponent(d.webcal)+'">Google Calendar</a>'+
        '<button class="btn ghost" id="calCopy">Copy link</button></div>'+
        '<div class="help" style="margin-top:.6rem">Keep this link private. Anyone with it can see the job list.</div></div>';
      $('#calCopy').addEventListener('click', function(){ (navigator.clipboard?navigator.clipboard.writeText(d.url):Promise.reject()).then(function(){ toast('Calendar link copied'); }).catch(function(){ prompt('Copy this link', d.url); }); });
    }).catch(function(e){ box.innerHTML=''; toast(e.message,true); });
  }
  load();
};

var SHOP_ORDERS_URL='https://ueauto.store/admin/orders.json?status=any&limit=250';
/* ───────── boot ───────── */
try{ S.token=localStorage.getItem(TOKEN_KEY); S.me=JSON.parse(localStorage.getItem(ME_KEY)||'null'); }catch(e){}
if(S.token && S.me){
  var exp=0; try{ exp=JSON.parse(atob(S.token.split('.')[0].replace(/-/g,'+').replace(/_/g,'/'))).exp; }catch(e){}
  if(!exp || exp>Date.now()) start(); else signOut();
} else signOut();
})();
</script>
