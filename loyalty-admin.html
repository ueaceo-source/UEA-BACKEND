<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>UEA Service Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000; --iron:#141414; --steel:#1f1f1f; --edge:#2e2e2e;
  --gold:#CBA135; --gold-hi:#E6C76A; --gold-lo:#8E6F1F;
  --purple:#6B2896; --purple-hi:#8A3FBF;
  --text:#EDE8DC; --dim:#9A9488; --good:#5FBF7A; --bad:#E0605A; --warn:#E8A33C;
  --display:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --head:'Oswald','Arial Narrow',Arial,sans-serif;
  --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--black);color:var(--text);font:15px/1.5 var(--body)}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
a{color:var(--gold-hi)}
.hide{display:none!important}
.steel{background:linear-gradient(180deg,#1c1c1c 0%,#121212 100%);border:1px solid var(--edge);border-radius:6px}
.btn{appearance:none;border:1px solid var(--gold-lo);border-radius:4px;padding:.55rem 1rem;cursor:pointer;text-decoration:none;display:inline-block;
  font-family:var(--head);font-weight:500;letter-spacing:.03em;line-height:1.2;
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);color:#140f02;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 0 #000}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--edge);box-shadow:none}
.btn.ghost:hover{border-color:var(--gold)}
.btn.purple{background:linear-gradient(180deg,var(--purple-hi),var(--purple));color:#fff;border-color:#4a1a69}
.btn.danger{background:transparent;border-color:#5a2522;color:var(--bad);box-shadow:none}
.btn.sm{padding:.32rem .65rem;font-size:.86rem}
input,select,textarea{background:#0a0a0a;border:1px solid var(--edge);border-radius:4px;padding:.55rem .7rem;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
input[type=checkbox]{width:auto;accent-color:#CBA135}
label{display:block;font-family:var(--head);font-size:.85rem;color:var(--dim);margin:0 0 .3rem}
.field{margin-bottom:.9rem}
.help{font-size:.82rem;color:var(--dim);margin-top:.25rem}
.dim{color:var(--dim)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:.8rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
h2{font-family:var(--display);font-weight:400;font-size:2.4rem;letter-spacing:.03em;margin:0 0 1.1rem;line-height:1}
h3{font-family:var(--head);font-weight:500;font-size:1.08rem;margin:0 0 .7rem}
.panel{padding:1rem 1.1rem}
.empty{padding:2rem 1rem;text-align:center;color:var(--dim)}
.err-text{color:var(--bad);font-size:.9rem;margin-top:.5rem}
.pts{font-family:var(--head);font-weight:600;white-space:nowrap}
.plus{color:var(--good)} .minus{color:var(--bad)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:var(--head);font-weight:500;color:var(--dim);font-size:.85rem;padding:.5rem .6rem;border-bottom:1px solid var(--edge)}
td{padding:.6rem;border-bottom:1px solid #1b1b1b;vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:#0f0f0f}
.scroll{overflow-x:auto}
.chip{display:inline-block;font-family:var(--head);font-size:.78rem;padding:.02rem .45rem;border-radius:3px;border:1px solid var(--edge);color:var(--dim);white-space:nowrap;line-height:1.5}
.chip.gold,.chip.active{border-color:var(--gold-lo);color:var(--gold-hi)}
.chip.purple,.chip.applied{border-color:var(--purple);color:#c9a2e6}
.chip.good,.chip.used{color:var(--good);border-color:#2c5a37}
.chip.bad,.chip.void{color:var(--bad);border-color:#5a2522}
.chip.warn{color:var(--warn);border-color:#6a4a16}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
#login form{width:100%;max-width:380px;padding:2rem}
.mark{display:flex;align-items:center;gap:.8rem;margin-bottom:1.5rem}
.bolt{width:44px;height:44px;flex:none;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);
  background:linear-gradient(135deg,var(--gold-hi),var(--gold) 40%,var(--gold-lo));display:grid;place-items:center}
.bolt::after{content:'';width:46%;height:46%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#3a2a05,#000)}
.mark h1{font-family:var(--display);font-size:2rem;letter-spacing:.04em;margin:0;line-height:1}
.mark small{display:block;color:var(--dim);font-family:var(--head);font-size:.85rem}

/* shell */
#app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{border-right:1px solid var(--edge);padding:1.1rem .7rem;background:#070707;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
nav .mark{margin:0 .4rem 1.2rem}
nav .mark h1{font-size:1.45rem}
nav .grp{font-family:var(--head);font-size:.78rem;color:#6e6a62;margin:.9rem .8rem .25rem}
nav button.tab{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;
  border-left:3px solid transparent;padding:.5rem .8rem;margin-bottom:.1rem;cursor:pointer;font-family:var(--head);font-size:1rem;color:var(--dim)}
nav button.tab:hover{color:var(--text)}
nav button.tab.on{color:var(--gold-hi);border-left-color:var(--gold);background:linear-gradient(90deg,rgba(203,161,53,.1),transparent)}
.count{background:var(--purple);color:#fff;border-radius:10px;font-size:.75rem;padding:0 .45rem;font-family:var(--body)}
nav .who{margin-top:auto;padding:.8rem;font-size:.85rem;color:var(--dim);border-top:1px solid var(--edge)}
main{padding:1.6rem 1.8rem 5rem;min-width:0}

/* jobs */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:.7rem;overflow-x:auto;padding-bottom:.6rem}
.col{background:#0b0b0b;border:1px solid var(--edge);border-radius:6px;padding:.55rem;min-height:120px}
.col h4{font-family:var(--head);font-weight:500;font-size:.92rem;margin:.1rem .2rem .55rem;display:flex;justify-content:space-between;color:var(--dim)}
.col h4 b{color:var(--text);font-weight:500}
.card{display:block;width:100%;text-align:left;background:linear-gradient(180deg,#1a1a1a,#121212);border:1px solid var(--edge);border-radius:5px;padding:.6rem .65rem;margin-bottom:.5rem;cursor:pointer;color:var(--text)}
.card:hover{border-color:var(--gold-lo)}
.card .t{font-family:var(--head);font-weight:500;font-size:.98rem;line-height:1.25}
.card .s{font-size:.84rem;color:var(--dim);margin-top:.15rem;line-height:1.35}
.card .f{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.4rem}
.day{display:grid;gap:.7rem}
.stop{display:grid;grid-template-columns:110px 1fr auto;gap:1rem;align-items:start;padding:.9rem 1rem}
.stop .when{font-family:var(--display);font-size:1.35rem;line-height:1.05;color:var(--gold-hi)}
.stop .when small{display:block;font-family:var(--body);font-size:.78rem;color:var(--dim);letter-spacing:0}
.stop .who{font-family:var(--head);font-size:1.08rem}
.stop .acts{display:flex;flex-direction:column;gap:.35rem;min-width:118px}

/* drawer */
#drawer{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;justify-content:flex-end;z-index:20}
#drawer .sheet{width:min(760px,100%);height:100%;overflow-y:auto;background:var(--iron);border-left:1px solid var(--gold-lo);padding:1.2rem 1.4rem 4rem}
.dtabs{display:flex;gap:.2rem;border-bottom:1px solid var(--edge);margin:1rem 0 1rem;position:sticky;top:-1.2rem;background:var(--iron);z-index:2;padding-top:.4rem;overflow-x:auto}
.dtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:.5rem .8rem;font-family:var(--head);font-size:.98rem;color:var(--dim);cursor:pointer;white-space:nowrap}
.dtabs button.on{color:var(--gold-hi);border-bottom-color:var(--gold)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:.35rem .8rem;font-size:.93rem}
.kv dt{color:var(--dim)} .kv dd{margin:0}
.sec{margin-bottom:1rem}
.est td{padding:.35rem .3rem;border-bottom:1px solid #1b1b1b}
.est input,.est select{padding:.38rem .45rem;font-size:.9rem}
.est .amt{font-family:var(--head);text-align:right;white-space:nowrap;padding-top:.6rem}
.totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.totals table td{border:0;padding:.18rem .2rem}
.totals .big td{font-family:var(--head);font-size:1.1rem;color:var(--gold-hi);border-top:1px solid var(--edge);padding-top:.4rem}
.ev{display:grid;grid-template-columns:112px 1fr;gap:.6rem;padding:.5rem 0;border-bottom:1px solid #1b1b1b;font-size:.9rem}
.ev .k{font-family:var(--head);font-size:.78rem;color:var(--dim)}
.tierline{display:flex;align-items:center;gap:1rem;margin:1rem 0}
.tierline .bolt{width:64px;height:64px}
.tierline .bolt::after{display:none}
.tierline .bolt b{font-family:var(--display);font-weight:400;color:#140f02;font-size:1.05rem}
.bar{height:6px;background:#000;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--gold))}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--edge);border:1px solid var(--edge);border-radius:6px;overflow:hidden;margin-bottom:1rem}
.gauge{background:var(--iron);padding:1.1rem 1.2rem}
.gauge b{display:block;font-family:var(--display);font-weight:400;font-size:2.5rem;line-height:1;color:var(--gold-hi)}
.gauge span{font-family:var(--head);color:var(--dim);font-size:.9rem}
.gauge em{display:block;font-style:normal;font-size:.8rem;color:var(--dim);margin-top:.3rem}
.settings table input{padding:.35rem .5rem}
.gres{display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:start;padding:.7rem .2rem;border-bottom:1px solid #1b1b1b}
.gres:last-child{border-bottom:0}
.gres h4{margin:0;font-family:var(--head);font-weight:500;font-size:1rem}
.gres .meta{font-size:.84rem;color:var(--dim);margin-top:.15rem}
.gres .price{font-family:var(--head);color:var(--gold-hi);white-space:nowrap;text-align:right}
.gpick{border:1px solid var(--gold-lo);border-radius:6px;padding:.8rem;margin:.6rem 0;background:#0d0d0d}
.gpick .list{max-height:380px;overflow-y:auto;margin-top:.5rem}
.parts-ed td{padding:.25rem .2rem;border:0}
.parts-ed input{padding:.35rem .45rem;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--steel);border:1px solid var(--gold);padding:.7rem 1.1rem;border-radius:4px;z-index:40;font-family:var(--head);max-width:92vw}
#toast.err{border-color:var(--bad)}

@media (max-width:900px){
  #app{grid-template-columns:1fr}
  nav{position:sticky;top:0;height:auto;z-index:10;flex-direction:row;overflow-x:auto;gap:.15rem;padding:.5rem;border-right:0;border-bottom:1px solid var(--edge)}
  nav .mark,nav .grp,nav .who{display:none}
  nav button.tab{width:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;margin:0;padding:.45rem .7rem}
  nav button.tab.on{border-bottom-color:var(--gold);background:none}
  main{padding:1.1rem .9rem 5rem}
  .gauges,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g3,.totals{grid-template-columns:1fr}
  h2{font-size:2rem}
  .stop{grid-template-columns:1fr}
  .stop .acts{flex-direction:row;flex-wrap:wrap}
  #drawer .sheet{padding:1rem 1rem 4rem}
  .kv{grid-template-columns:100px 1fr}
}
@media (prefers-reduced-motion:no-preference){
  #drawer .sheet{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
}
</style>
</head>
<body>

<section id="login" class="hide">
  <form class="steel" id="loginForm">
    <div class="mark"><div class="bolt"></div><div><h1>Upper Echelon</h1><small>Service desk</small></div></div>
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%">Sign in</button>
    <div id="loginErr" class="err-text"></div>
  </form>
</section>

<div id="app" class="hide">
  <nav id="nav"></nav>
  <main id="view"></main>
</div>

<div id="drawer" class="hide"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="hide" role="status"></div>

<script>
(function(){
'use strict';
var API = location.pathname.replace(/\/admin\/?$/, '');
var TOKEN_KEY = 'uea_desk_token', ME_KEY = 'uea_desk_me';
var S = { tab:null, token:null, me:null, settings:null, prefill:null, jobsView:'board', methods:null };

/* ───────── helpers ───────── */
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function usd(c){ return '$' + (Number(c||0)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function n(v){ return Number(v||0).toLocaleString(); }
function when(d){ if(!d) return ''; var x=new Date(d); return x.toLocaleDateString(undefined,{month:'short',day:'numeric',year:x.getFullYear()!==new Date().getFullYear()?'numeric':undefined})+' '+x.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function dayLabel(iso){ if(!iso) return ''; var p=String(iso).slice(0,10).split('-'); var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'}); }
function signed(p){ p=Number(p); return '<span class="pts '+(p>=0?'plus':'minus')+'">'+(p>=0?'+':'')+n(p)+'</span>'; }
function telHref(p){ return 'tel:'+String(p||'').replace(/[^\d+]/g,''); }
function smsHref(p){ return 'sms:'+String(p||'').replace(/[^\d+]/g,''); }
function mapHref(a){ return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a||''); }
function dollars(c){ return c ? (Number(c)/100).toFixed(2) : ''; }
function cents(v){ return Math.round((parseFloat(v)||0)*100); }
function isRole(){ var r=S.me&&S.me.role; return Array.prototype.slice.call(arguments).indexOf(r)>-1; }
var DESK = function(){ return isRole('owner','writer'); };
var OWN = function(){ return isRole('owner'); };
var TYPE = {earn:'Service',welcome:'Welcome',referral:'Referral',review:'Review',redeem:'Redeemed',void:'Returned',adjust:'Adjustment',refund:'Refund',bonus:'Bonus',expire:'Expired'};
var STAGE_CHIP = {new:'gold',scheduled:'',en_route:'purple',on_site:'purple',waiting_approval:'warn',waiting_parts:'warn',in_progress:'purple',completed:'good'};
var STAGES = [['new','New'],['scheduled','Scheduled'],['en_route','On the way'],['on_site','On site'],['waiting_approval','Waiting on approval'],['waiting_parts','Waiting on parts'],['in_progress','Working'],['completed','Done, not paid']];
function stageLabel(k){ for(var i=0;i<STAGES.length;i++) if(STAGES[i][0]===k) return STAGES[i][1]; return k; }
function stageChip(j){
  if(j.status==='paid') return '<span class="chip good">Paid</span>';
  if(j.status==='cancelled') return '<span class="chip bad">Cancelled</span>';
  return '<span class="chip '+(STAGE_CHIP[j.stage]||'')+'">'+esc(stageLabel(j.stage))+'</span>';
}
function fe(f, n){ return f.querySelector('[name="'+n+'"]'); }
function fill(tpl, v){ return String(tpl||'').replace(/\{(\w+)\}/g, function(m,k){ return v[k]!=null?String(v[k]):''; }).replace(/\s{2,}/g,' ').trim(); }

function toast(msg, err){
  var t=$('#toast'); t.textContent=msg; t.className=err?'err':''; clearTimeout(t._h);
  t._h=setTimeout(function(){ t.className='hide'; }, 3500);
}
function api(path, opts){
  opts = opts || {};
  return fetch(API + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+(S.token||'') },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if (r.status===401 && path!=='/admin/login') { signOut(); throw new Error(d.error||'Signed out'); }
      if (!r.ok) throw new Error(d.error || ('Request failed ('+r.status+')'));
      return d;
    });
  });
}
function busy(btn, on, label){ if(!btn) return; if(on){ btn._t=btn.textContent; btn.disabled=true; btn.textContent=label||'Working…'; } else { btn.disabled=false; if(btn._t) btn.textContent=btn._t; } }

/* ───────── auth ───────── */
function signOut(){
  try{ sessionStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(ME_KEY); }catch(e){}
  S.token=null; S.me=null; $('#drawer').classList.add('hide');
  $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#em').focus();
}
$('#loginForm').addEventListener('submit', function(e){
  e.preventDefault(); $('#loginErr').textContent='';
  var b=e.target.querySelector('button'); busy(b,true,'Signing in…');
  api('/admin/login',{method:'POST',body:{email:$('#em').value,password:$('#pw').value}}).then(function(d){
    S.token=d.token; S.me=d.staff;
    try{ sessionStorage.setItem(TOKEN_KEY,d.token); sessionStorage.setItem(ME_KEY,JSON.stringify(d.staff)); }catch(e){}
    $('#pw').value=''; start();
  }).catch(function(err){ $('#loginErr').textContent=err.message; }).then(function(){ busy(b,false); });
});

var NAV = [
  {grp:'Work'},
  {tab:'today', label:function(){ return isRole('tech')?'My day':'Today'; }, roles:['owner','writer','tech']},
  {tab:'jobs', label:function(){ return isRole('tech')?'My jobs':'Jobs'; }, roles:['owner','writer','tech'], count:'cJobs'},
  {tab:'new', label:'New job', roles:['owner','writer']},
  {tab:'guide', label:'Quotes & labor guide', roles:['owner','writer']},
  {tab:'followups', label:'Follow-ups', roles:['owner','writer'], count:'cFollow'},
  {grp:'Customers', roles:['owner','writer']},
  {tab:'customers', label:'Customers', roles:['owner','writer']},
  {tab:'vouchers', label:'Reward vouchers', roles:['owner','writer'], count:'cVouchers'},
  {tab:'points', label:'Add points', roles:['owner']},
  {grp:'Business', roles:['owner']},
  {tab:'overview', label:'Overview', roles:['owner']},
  {tab:'staff', label:'Team & access', roles:['owner']},
  {tab:'settings', label:'Settings', roles:['owner']},
  {grp:'You'},
  {tab:'account', label:'My account', roles:['owner','writer','tech']}
];
function buildNav(){
  var r=S.me.role, h='<div class="mark"><div class="bolt"></div><div><h1>Upper Echelon</h1><small>Service desk</small></div></div>';
  NAV.forEach(function(it){
    if(it.roles && it.roles.indexOf(r)<0) return;
    if(it.grp){ h+='<div class="grp">'+it.grp+'</div>'; return; }
    var lab=typeof it.label==='function'?it.label():it.label;
    h+='<button class="tab" data-tab="'+it.tab+'">'+esc(lab)+(it.count?' <span class="count hide" id="'+it.count+'"></span>':'')+'</button>';
  });
  h+='<div class="who">'+esc(S.me.name)+'<br>'+esc({owner:'Owner',writer:'Service writer',tech:'Technician'}[r])+'</div>';
  $('#nav').innerHTML=h;
  $$('#nav .tab').forEach(function(b){ b.addEventListener('click', function(){ go(b.dataset.tab); }); });
}
function start(){
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  buildNav(); go(S.tab||'today'); refreshCounts();
  api('/admin/me').then(function(d){ S.me=d.staff; try{ sessionStorage.setItem(ME_KEY,JSON.stringify(d.staff)); }catch(e){} }).catch(function(){});
}
function setCount(id, v){ var el=$('#'+id); if(!el) return; el.textContent=v; el.classList.toggle('hide', !v); }
function refreshCounts(){
  api('/admin/jobs?view=open').then(function(d){ setCount('cJobs', d.jobs.length); }).catch(function(){});
  if(DESK()){
    api('/admin/followups').then(function(d){ setCount('cFollow', d.followups.filter(function(f){return f.due;}).length); }).catch(function(){});
    api('/admin/vouchers?status=open').then(function(d){ setCount('cVouchers', d.vouchers.length); }).catch(function(){});
  }
}
var VIEWS = {};
function go(tab){
  var allowed=$$('#nav .tab').map(function(b){ return b.dataset.tab; });
  if(allowed.indexOf(tab)<0) tab='today';
  S.tab=tab; $$('#nav .tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===tab); });

function decodeVin(vinInput, vehInput){
  var vin=(vinInput.value||'').toUpperCase().trim();
  if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) return toast('Enter the full 17-character VIN first', true);
  toast('Decoding VIN…');
  fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+vin+'?format=json').then(function(r){ return r.json(); }).then(function(d){
    var r=d.Results&&d.Results[0]; if(!r||!r.Make) throw new Error('VIN not recognized');
    var tc=function(s){ return String(s||'').toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase();}); };
    var eng=r.DisplacementL?(Math.round(parseFloat(r.DisplacementL)*10)/10)+'L':'';
    var v=[r.ModelYear, tc(r.Make), r.Model, r.Trim, eng].filter(Boolean).join(' ');
    if(vehInput && !vehInput.disabled) vehInput.value=v;
    vinInput.value=vin; toast('Decoded: '+v);
  }).catch(function(e){ toast('Could not decode: '+e.message, true); });
}

function paintLines(canEdit){

        '<td><input data-i="'+i+'" data-f="desc" value="'+esc(l.desc)+'" placeholder="'+(l.type==='part'?'Part name':'Description')+'"'+dis+'>'+
          (l.type==='part'?'<div class="row" style="gap:.3rem;margin-top:.3rem;flex-wrap:nowrap"><input data-i="'+i+'" data-f="part_no" value="'+esc(l.part_no||'')+'" placeholder="Part #" style="max-width:120px"'+dis+'><input data-i="'+i+'" data-f="cost" value="'+dollars(l.cost_cents)+'" placeholder="Cost $" inputmode="decimal" style="max-width:90px"'+dis+'>'+(canEdit?'<button type="button" class="btn ghost sm" data-markup="'+i+'" title="Apply markup">%</button>':'')+'</div>':'')+'</td>'+
        '<td><input data-i="'+i+'" data-f="qty" value="'+esc(l.qty)+'" inputmode="decimal"'+dis+'>'+(canEdit&&DESK()&&l.type==='labor'&&l.guide_id?'<button type="button" class="btn ghost sm" data-savetime="'+i+'" title="Use this time next time you quote this vehicle" style="margin-top:.3rem;font-size:.72rem;padding:.15rem .4rem">Save for this vehicle</button>':'')+'</td>'+
        '<td><input data-i="'+i+'" data-f="unit" value="'+dollars(l.unit_cents)+'" inputmode="decimal" placeholder="0.00"'+dis+'></td>'+

    }).join('') : '<tr><td class="dim" style="padding:1rem 0">No lines yet. Add labor, parts, or fees.</td></tr>';
  $$('#estRows [data-f]').forEach(function(inp){ inp.addEventListener('change', function(){
    var l=J.lines[+inp.dataset.i], f=inp.dataset.f;
    if(f==='type'){ l.type=inp.value; if(l.type==='discount') l.status='approved'; paintLines(canEdit); return; }
    if(f==='desc') l.desc=inp.value;
    if(f==='part_no') l.part_no=inp.value;
    if(f==='qty') l.qty=parseFloat(inp.value)||0;
    if(f==='unit') l.unit_cents=cents(inp.value);
    if(f==='cost') l.cost_cents=inp.value===''?null:cents(inp.value);
    if(f==='status') l.status=inp.value;
    if(f!=='desc'&&f!=='part_no') paintLines(canEdit); else paintTotals();
  }); });
  $$('#estRows [data-savetime]').forEach(function(btn){ btn.addEventListener('click', function(){
    var l=J.lines[+btn.dataset.savetime];
    if(!J.booking.vehicle) return toast('Add the vehicle on the Job tab first', true);
    api('/admin/guide/job/'+encodeURIComponent(l.guide_id)+'/save-vehicle-time',{method:'POST',body:{vehicle:J.booking.vehicle,labor_hours:l.qty}})
      .then(function(r){ toast('Saved '+l.qty+' hr for '+r.label); }).catch(function(e){ toast(e.message,true); });
  }); });
  $$('#estRows [data-del]').forEach(function(btn){ btn.addEventListener('click', function(){ J.lines.splice(+btn.dataset.del,1); paintLines(canEdit); }); });
  $$('#estRows [data-markup]').forEach(function(btn){ btn.addEventListener('click', function(){
    var l=J.lines[+btn.dataset.markup]; if(!l.cost_cents) return toast('Enter the part cost first', true);
    l.unit_cents=Math.round(l.cost_cents*(1+(Number(J.shop.parts_markup_pct)||0)/100)); paintLines(canEdit);
  }); });
  paintTotals();

function calcTotals(lines, keep){
  var t={labor:0,parts:0,fees:0,discount:0};
  lines.forEach(function(l){ if(!keep(l)) return; var a=Math.round((Number(l.qty)||0)*(Number(l.unit_cents)||0));
    if(l.type==='labor') t.labor+=a; else if(l.type==='part') t.parts+=a; else if(l.type==='fee') t.fees+=a; else t.discount+=a; });
  t.tax=Math.round(t.parts*(Number(J.shop.parts_tax_rate)||0)/100); t.total=Math.max(0,t.labor+t.parts+t.fees-t.discount)+t.tax;
  var cost=0, hasCost=false; lines.forEach(function(l){ if(keep(l)&&l.type==='part'&&l.cost_cents!=null){ cost+=Math.round((Number(l.qty)||0)*l.cost_cents); hasCost=true; } });
  t.partsProfit=hasCost?t.parts-cost:null; return t;
}
function paintTotals(){
  var q=calcTotals(J.lines,function(l){ return l.status!=='declined'; }), a=calcTotals(J.lines,function(l){ return l.type==='discount'||l.status==='approved'; });
  var tbl=function(t,title){ return '<div class="steel panel"><h3>'+title+'</h3><table><tr><td>Labor</td><td style="text-align:right">'+usd(t.labor)+'</td></tr><tr><td>Parts</td><td style="text-align:right">'+usd(t.parts)+'</td></tr>'+
    (t.fees?'<tr><td>Fees</td><td style="text-align:right">'+usd(t.fees)+'</td></tr>':'')+(t.discount?'<tr><td>Discounts</td><td style="text-align:right">−'+usd(t.discount)+'</td></tr>':'')+
    '<tr><td>Tax on parts ('+(J.shop.parts_tax_rate||0)+'%)</td><td style="text-align:right">'+usd(t.tax)+'</td></tr><tr class="big"><td>Total</td><td style="text-align:right">'+usd(t.total)+'</td></tr>'+
    (DESK()&&t.partsProfit!=null?'<tr><td class="dim" style="font-size:.82rem">Parts profit (staff only)</td><td class="dim" style="text-align:right;font-size:.82rem">'+usd(t.partsProfit)+'</td></tr>':'')+'</table></div>'; };
  $('#estTotals').innerHTML=tbl(q,'Quoted (not declined)')+tbl(a,'Approved so far');
}
function saveEstimate(){
  var bad=J.lines.filter(function(l){ return !String(l.desc||'').trim(); });
  if(bad.length) return Promise.reject(new Error('Every line needs a description.'));
  return api('/admin/booking/'+J.booking.id+'/estimate',{method:'PUT',body:{lines:J.lines,notes:$('#estNotes').value}});
}

/* ───────── LABOR & PARTS GUIDE ───────── */
var META=null;
function loadMeta(){ return META?Promise.resolve(META):api('/admin/meta').then(function(m){ META=m; return m; }); }
function guideToLines(r, rate, markup){
  var lines=[];
  if(r.flat_cents!=null) lines.push({type:'fee',desc:r.name,qty:1,unit_cents:r.flat_cents,status:'pending',guide_id:r.id});
  else if(r.labor_hours>0) lines.push({type:'labor',desc:r.name+' (labor)',qty:r.labor_hours,unit_cents:rate||0,status:'pending',guide_id:r.id});
  (r.parts||[]).forEach(function(p){ lines.push({type:'part',desc:p.name,part_no:p.part_no||null,qty:Number(p.qty)||1,cost_cents:p.cost_cents||0,
    unit_cents:Math.round((p.cost_cents||0)*(1+(Number(markup)||0)/100)),status:'pending',guide_id:r.id}); });
  return lines;
}
function guideRow(r, rate, markup){
  var partsCost=(r.parts||[]).reduce(function(a,p){ return a+(p.cost_cents||0)*(Number(p.qty)||1); },0);
  var partsPrice=Math.round(partsCost*(1+(Number(markup)||0)/100));
  var labor=r.flat_cents!=null?r.flat_cents:Math.round(r.labor_hours*(rate||0));
  var h=r.history||{};
  var hist=h.vehicle_times_quoted?'Quoted '+h.vehicle_times_quoted+'× on this make/model, avg '+h.vehicle_avg_hours+' hr':(h.times_quoted?'Quoted '+h.times_quoted+'× before, avg '+h.avg_hours+' hr':'');
  return '<div class="gres"><div><h4>'+esc(r.name)+'</h4>'+
    '<div class="meta">'+(r.flat_cents!=null?'Flat '+usd(r.flat_cents):'<b style="color:var(--text)">'+r.labor_hours+' hr</b>')+
      (r.source==='vehicle'?' <span class="chip good">'+esc(r.override_label)+' time</span>':' <span class="chip">Standard time</span>')+
      ((r.parts||[]).length?' &middot; '+r.parts.length+' part'+(r.parts.length>1?'s':'')+', cost '+usd(partsCost):'')+'</div>'+
    (hist?'<div class="meta">'+esc(hist)+'</div>':'')+(r.notes?'<div class="meta" style="color:var(--warn)">'+esc(r.notes)+'</div>':'')+'</div>'+

function quoteTotals(lines, taxRate){
  var t={labor:0,parts:0,fees:0,discount:0};
  lines.forEach(function(l){ var a=Math.round((Number(l.qty)||0)*(Number(l.unit_cents)||0));
    if(l.type==='labor') t.labor+=a; else if(l.type==='part') t.parts+=a; else if(l.type==='fee') t.fees+=a; else t.discount+=a; });
  t.tax=Math.round(t.parts*(Number(taxRate)||0)/100); t.total=Math.max(0,t.labor+t.parts+t.fees-t.discount)+t.tax; return t;
}

        '<dt>Technician</dt><dd>Only jobs assigned to them: their day, navigation, "On my way" texts, stage updates, findings, VIN and mileage, notes, and estimates if you allow it in Settings.</dd></div></div>'+
      '<div class="steel panel sec"><h3>Team</h3>'+(d.staff.length?'<div class="scroll"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Last sign-in</th><th></th></tr>'+d.staff.map(function(s){
        return '<tr><td>'+esc(s.name)+(s.active?'':' <span class="chip bad">Disabled</span>')+'<div class="dim" style="font-size:.82rem">'+esc(s.phone||'')+'</div></td><td>'+esc(s.email)+'</td>'+
          '<td><select data-role="'+s.id+'" style="width:auto">'+['owner','writer','tech'].map(function(r){ return '<option value="'+r+'"'+(r===s.role?' selected':'')+'>'+roleName[r]+'</option>'; }).join('')+'</select></td>'+
          '<td class="dim">'+(s.last_login_at?when(s.last_login_at):'Never')+'</td>'+
          '<td style="white-space:nowrap"><button class="btn ghost sm" data-reset="'+s.id+'">Reset password</button> <button class="btn '+(s.active?'danger':'ghost')+' sm" data-active="'+s.id+'" data-on="'+(s.active?0:1)+'">'+(s.active?'Disable':'Enable')+'</button></td></tr>';
      }).join('')+'</table></div>':'<div class="dim">No team members yet. Add yourself as a technician or owner if you work jobs, so you can be assigned.</div>')+'</div>'+
      '<form id="addStaff" class="steel panel" style="max-width:760px"><h3>Add a team member</h3><div class="grid g2">'+fld('Name','name','')+fld('Email (their sign-in)','email','','','email')+fld('Cell phone','phone','','','tel')+
        '<div class="field"><label>Role</label><select name="role"><option value="writer">Service writer</option><option value="tech">Technician</option><option value="owner">Owner</option></select></div></div>'+
        '<div class="field"><label>Temporary password</label><div class="row" style="flex-wrap:nowrap"><input name="password" minlength="10"><button type="button" class="btn ghost sm" id="genPw">Generate</button></div><div class="help">Give it to them in person or by text. They can change it under My account.</div></div>'+
        '<button class="btn">Add team member</button><div id="stOut" class="help" style="margin-top:.6rem"></div></form>';
    $('#genPw').addEventListener('click', function(){ var c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789', a=new Uint32Array(12); crypto.getRandomValues(a); fe($('#addStaff'),'password').value=Array.prototype.map.call(a,function(x){ return c[x%c.length]; }).join(''); });
    $('#addStaff').addEventListener('submit', function(e){
      e.preventDefault(); var f=e.target;
      api('/admin/staff',{method:'POST',body:{name:fe(f,'name').value,email:fe(f,'email').value,phone:fe(f,'phone').value,role:fe(f,'role').value,password:fe(f,'password').value}})
        .then(function(){ toast('Team member added. Sign-in: '+fe(f,'email').value); VIEWS.staff(); }).catch(function(err){ $('#stOut').innerHTML='<span class="minus">'+esc(err.message)+'</span>'; });
    });
    $$('[data-role]').forEach(function(s){ s.addEventListener('change', function(){ api('/admin/staff/'+s.dataset.role,{method:'PATCH',body:{role:s.value}}).then(function(){ toast('Role updated. They\'ll need to sign in again.'); }).catch(function(e){ toast(e.message,true); }); }); });
    $$('[data-active]').forEach(function(b){ b.addEventListener('click', function(){ var on=b.dataset.on==='1'; if(!on&&!confirm('Disable this account? They\'re signed out right away.')) return;
      api('/admin/staff/'+b.dataset.active,{method:'PATCH',body:{active:on}}).then(function(){ toast(on?'Account enabled':'Account disabled'); VIEWS.staff(); }).catch(function(e){ toast(e.message,true); }); }); });
    $$('[data-reset]').forEach(function(b){ b.addEventListener('click', function(){ var pw=prompt('New temporary password (10+ characters):',''); if(!pw) return;
      api('/admin/staff/'+b.dataset.reset,{method:'PATCH',body:{password:pw}}).then(function(){ toast('Password reset. They\'re signed out until they use it.'); }).catch(function(e){ toast(e.message,true); }); }); });
  }).catch(fail);
};

/* ───────── MY ACCOUNT ───────── */
VIEWS.account = function(){
  var owner=!S.me.id;
  $('#view').innerHTML='<h2>My account</h2><div class="steel panel sec" style="max-width:560px"><div class="kv"><dt>Name</dt><dd>'+esc(S.me.name)+'</dd><dt>Email</dt><dd>'+esc(S.me.email)+'</dd><dt>Role</dt><dd>'+esc({owner:'Owner',writer:'Service writer',tech:'Technician'}[S.me.role])+'</dd></div></div>'+
    (owner?'<div class="steel panel sec" style="max-width:560px">You\'re signed in with the main owner login. Its password is <b>LOYALTY_ADMIN_PASSWORD</b> on Render; change it there.</div>':
    '<form id="pwForm" class="steel panel sec" style="max-width:560px"><h3>Change password</h3>'+fld('Current password','current','','','password')+fld('New password (10+ characters)','next','','','password')+'<button class="btn">Change password</button><div id="pwOut" class="help" style="margin-top:.6rem"></div></form>')+
    '<button class="btn ghost" id="soBtn">Sign out</button>';
  $('#soBtn').addEventListener('click', signOut);
  if($('#pwForm')) $('#pwForm').addEventListener('submit', function(e){ e.preventDefault(); var f=e.target;
    api('/admin/password',{method:'POST',body:{current:fe(f,'current').value,next:fe(f,'next').value}}).then(function(){ toast('Password changed. Sign in again.'); signOut(); }).catch(function(err){ $('#pwOut').innerHTML='<span class="minus">'+esc(err.message)+'</span>'; }); });
};

/* ───────── SETTINGS (owner) ───────── */
VIEWS.settings = function(){
  api('/admin/settings').then(function(d){ S.settings=JSON.parse(JSON.stringify(d.config)); S.defaults=d.defaults; S.windows=S.settings.time_windows; renderSettings(); }).catch(fail);
};
function renderSettings(){
  var c=S.settings;
  function num(name,label,val,help,step){ return '<div class="field"><label>'+label+'</label><input data-k="'+name+'" type="number" step="'+(step||'1')+'" value="'+esc(val)+'">'+(help?'<div class="help">'+help+'</div>':'')+'</div>'; }
  function txt(name,label,val,help,ph){ return '<div class="field"><label>'+label+'</label><input data-k="'+name+'" value="'+esc(val||'')+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'+(help?'<div class="help">'+help+'</div>':'')+'</div>'; }
  var tl={confirm:'Confirm appointment',on_way:'On my way',estimate:'Estimate ready',complete:'Job done + payment link',follow_up:'Recommended work follow-up',review:'Ask for a review'};
  $('#view').innerHTML='<h2>Settings</h2><div class="settings">'+
    '<div class="steel panel sec"><h3>Shop</h3><div class="grid g3">'+
      txt('shop_phone','Shop phone',c.shop_phone)+txt('payment_link','Payment portal link',c.payment_link,'Goes in the "Job done" text','https://...')+txt('notify_phone','Your cell for alerts',c.notify_phone,'Texted when a customer approves an estimate')+
      num('labor_rate','Labor rate ($/hr)',(c.labor_rate_cents||0)/100,'Default for new labor lines. 0 = type each price',0.01)+num('parts_markup_pct','Parts markup (%)',c.parts_markup_pct,'Applied with the % button on part lines',0.5)+num('parts_tax_rate','Sales tax on parts (%)',c.parts_tax_rate,'Confirm what\'s taxable with your CPA',0.01)+
      num('follow_up_days','Follow up declined work after (days)',c.follow_up_days)+
    '</div><div class="field"><label>Appointment time windows (comma-separated)</label><input data-k="time_windows" value="'+esc((c.time_windows||[]).join(', '))+'"></div>'+
    '<label class="row" style="color:var(--text);font-family:var(--body)"><input type="checkbox" data-k="tech_can_estimate"'+(c.tech_can_estimate!==false?' checked':'')+'> Technicians can build and send estimates from the field</label></div>'+
    '<div class="steel panel sec"><h3>Text message templates</h3><div class="help" style="margin:-.5rem 0 .8rem">Placeholders: {first} {name} {service} {vehicle} {date} {window} {tech} {eta} {estimate_link} {total} {pay_link} {shop_phone} {review_link} {recommended}</div>'+
      Object.keys(tl).map(function(k){ return '<div class="field"><label>'+tl[k]+'</label><textarea data-tpl="'+k+'" rows="2">'+esc((c.sms_templates||{})[k]||'')+'</textarea></div>'; }).join('')+'</div>'+
    '<div class="steel panel sec"><h3>Rewards: earning</h3><div class="grid g4">'+
      num('points_per_dollar','Points per $1 of labor',c.points_per_dollar,'Also for fees paid in Shopify',0.25)+num('parts_points_per_dollar','Points per $1 of parts',c.parts_points_per_dollar==null?c.points_per_dollar:c.parts_points_per_dollar,'',0.25)+
      num('welcome_bonus','Welcome bonus',c.welcome_bonus,'After first paid service')+num('cents_per_point','Cost per point (¢)',c.cents_per_point,'For the liability estimate',0.1)+
      num('referral_bonus_referrer','Referral: referrer gets',c.referral_bonus_referrer)+num('referral_bonus_friend','Referral: friend gets',c.referral_bonus_friend)+
      num('referral_min_dollars','Referral minimum job ($)',c.referral_min_cents/100)+num('expire_months','Points expire after (months)',c.expire_months,'0 = never')+
      num('book_ahead_bonus','Book-ahead bonus',c.book_ahead_bonus)+num('book_ahead_days','Book-ahead days',c.book_ahead_days)+num('offpeak_bonus','Slow-day bonus',c.offpeak_bonus)+
      num('review_bonus','Google review bonus',c.review_bonus,'Leave at 0. Google bans rewards for reviews.')+'</div>'+
      '<div class="field"><label>Slow days</label><div class="row">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d,i){ return '<label class="row" style="gap:.3rem;margin:0;color:var(--text);font-family:var(--body)"><input type="checkbox" data-day="'+i+'"'+((c.offpeak_days||[]).indexOf(i)>-1?' checked':'')+'>'+d+'</label>'; }).join('')+'</div></div>'+
      txt('payment_methods','Payment methods (comma-separated)',(c.payment_methods||[]).join(', '))+txt('google_review_url','Google review link',c.google_review_url,'Used in the "Ask for a review" text','https://g.page/r/.../review')+'</div>'+
    '<div class="steel panel sec"><h3>Rewards: tiers</h3><div class="scroll"><table><tr><th>Name</th><th>Spend from ($)</th><th>Multiplier</th><th>Perks (one per line)</th><th></th></tr>'+
      c.tiers.map(function(t,i){ return '<tr><td><input data-t="'+i+'" data-f="name" value="'+esc(t.name)+'"></td><td><input data-t="'+i+'" data-f="min" type="number" value="'+(t.min_spend_cents/100)+'"></td><td><input data-t="'+i+'" data-f="multiplier" type="number" step="0.05" value="'+t.multiplier+'"></td><td><textarea data-t="'+i+'" data-f="perks" rows="2">'+esc((t.perks||[]).join('\n'))+'</textarea></td><td><button class="btn danger sm" data-deltier="'+i+'">Remove</button></td></tr>'; }).join('')+
      '</table></div><button class="btn ghost sm" id="addTier" style="margin-top:.6rem">Add tier</button></div>'+
    '<div class="steel panel sec"><h3>Rewards: catalog</h3><div class="scroll"><table><tr><th>On</th><th>Name</th><th>Points</th><th>Value ($)</th><th>Min invoice ($)</th><th>Description</th><th></th></tr>'+
      c.rewards.map(function(r,i){ return '<tr><td><input type="checkbox" data-r="'+i+'" data-f="active"'+(r.active?' checked':'')+'></td><td><input data-r="'+i+'" data-f="name" value="'+esc(r.name)+'"></td><td><input data-r="'+i+'" data-f="points" type="number" value="'+r.points+'"></td><td><input data-r="'+i+'" data-f="value" type="number" step="0.01" value="'+(r.value_cents/100)+'"></td><td><input data-r="'+i+'" data-f="min" type="number" value="'+((r.min_invoice_cents||0)/100)+'"></td><td><input data-r="'+i+'" data-f="description" value="'+esc(r.description||'')+'"></td><td><button class="btn danger sm" data-delrew="'+i+'">Remove</button></td></tr>'; }).join('')+
      '</table></div><button class="btn ghost sm" id="addRew" style="margin-top:.6rem">Add reward</button></div>'+
    '<div class="steel panel sec"><h3>Your extra program rules</h3><div class="help" style="margin:-.5rem 0 .8rem">Shown on the website rules page. One per line.</div><textarea data-k="terms_extra" rows="3">'+esc((c.terms_extra||[]).join('\n'))+'</textarea></div>'+
    '<div class="row"><button class="btn" id="saveSet">Save settings</button><button class="btn ghost" id="resetSet">Load recommended defaults</button></div></div>';
  $$('[data-k]').forEach(function(inp){ inp.addEventListener('change', function(){
    var k=inp.dataset.k, v=inp.value;
    if(k==='tech_can_estimate') c.tech_can_estimate=inp.checked;
    else if(k==='labor_rate') c.labor_rate_cents=cents(v);
    else if(k==='referral_min_dollars') c.referral_min_cents=cents(v);
    else if(k==='time_windows'||k==='payment_methods') c[k]=v.split(',').map(function(x){return x.trim();}).filter(Boolean);
    else if(k==='terms_extra') c.terms_extra=v.split('\n').map(function(x){return x.trim();}).filter(Boolean);
    else if(['shop_phone','payment_link','notify_phone','google_review_url'].indexOf(k)>-1) c[k]=v.trim();
    else c[k]=parseFloat(v);
  }); });
  $$('[data-tpl]').forEach(function(ta){ ta.addEventListener('change', function(){ c.sms_templates=c.sms_templates||{}; c.sms_templates[ta.dataset.tpl]=ta.value; }); });
  $$('[data-day]').forEach(function(cb){ cb.addEventListener('change', function(){ c.offpeak_days=$$('[data-day]').filter(function(x){return x.checked;}).map(function(x){return +x.dataset.day;}); }); });
  $$('[data-t]').forEach(function(inp){ inp.addEventListener('change', function(){ var t=c.tiers[inp.dataset.t], f=inp.dataset.f;
    if(f==='min') t.min_spend_cents=cents(inp.value); else if(f==='multiplier') t.multiplier=parseFloat(inp.value); else if(f==='perks') t.perks=inp.value.split('\n').map(function(s){return s.trim();}).filter(Boolean); else t.name=inp.value.trim(); }); });
  $$('[data-r]').forEach(function(inp){ inp.addEventListener('change', function(){ var r=c.rewards[inp.dataset.r], f=inp.dataset.f;
    if(f==='active') r.active=inp.checked; else if(f==='points') r.points=parseInt(inp.value,10); else if(f==='value') r.value_cents=cents(inp.value); else if(f==='min') r.min_invoice_cents=cents(inp.value); else r[f]=inp.value.trim(); }); });
  $$('[data-deltier]').forEach(function(b){ b.addEventListener('click', function(){ c.tiers.splice(+b.dataset.deltier,1); renderSettings(); }); });
  $$('[data-delrew]').forEach(function(b){ b.addEventListener('click', function(){ c.rewards.splice(+b.dataset.delrew,1); renderSettings(); }); });
  $('#addTier').addEventListener('click', function(){ c.tiers.push({key:'tier'+Date.now().toString(36),name:'New tier',min_spend_cents:0,multiplier:1,perks:[]}); renderSettings(); });
  $('#addRew').addEventListener('click', function(){ c.rewards.push({key:'r'+Date.now().toString(36),name:'New reward',points:1000,value_cents:2500,min_invoice_cents:0,active:false,description:''}); renderSettings(); });
  $('#resetSet').addEventListener('click', function(){ if(confirm('Replace everything here with the recommended defaults? Nothing is saved until you press Save.')){ S.settings=JSON.parse(JSON.stringify(S.defaults)); renderSettings(); } });
  $('#saveSet').addEventListener('click', function(){ c.tiers.sort(function(a,b){ return a.min_spend_cents-b.min_spend_cents; });
    api('/admin/settings',{method:'PUT',body:{config:c}}).then(function(d){ S.settings=d.config; S.windows=d.config.time_windows; toast('Settings saved'); renderSettings(); }).catch(function(e){ toast(e.message,true); }); });
}

/* ───────── boot ───────── */
try{ S.token=sessionStorage.getItem(TOKEN_KEY); S.me=JSON.parse(sessionStorage.getItem(ME_KEY)||'null'); }catch(e){}
if(S.token && S.me){
  var exp=0; try{ exp=JSON.parse(atob(S.token.split('.')[0].replace(/-/g,'+').replace(/_/g,'/'))).exp; }catch(e){}
  if(exp>Date.now()) start(); else signOut();
} else signOut();
})();
</script>
</body>
</html>
