<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0A10">
<title>UEA Service Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   UEA SERVICE DESK — matches ueauto.store
   Purple-tinted dark surfaces, gold is the only accent, Archivo throughout.
   Buttons are chamfered, containers 12px, controls 6px. Hex = brand marker.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  /* Surfaces (same as the website) */
  --black:#0B0A10; --iron:#120E1B; --steel:#1A1428; --raised-2:#241C38;
  --edge:rgba(226,214,255,.10); --edge-strong:rgba(226,214,255,.18);
  /* Brand */
  --gold:#CBA135; --gold-hi:#D8B24D; --gold-lo:#B48E2C; --gold-soft:rgba(203,161,53,.12);
  --purple:#6B2896; --purple-hi:#8A3FBF; --purple-soft:rgba(107,40,150,.22);
  /* Text */
  --text:#F3EFE8; --dim:rgba(243,239,232,.66); --faint:rgba(243,239,232,.5);
  /* State (kept apart from the gold accent) */
  --good:#5FBF7A; --bad:#F07A73; --warn:#E8A33C;
  /* Type: one family, different widths */
  --display:'Archivo','Arial',sans-serif;
  --head:'Archivo','Arial',sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
  --chamfer:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%);
  --hex:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--black);color:var(--text);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}
.hide{display:none!important}
.steel{background:var(--steel);border:1px solid var(--edge);border-radius:12px}

/* Buttons */
.btn{appearance:none;border:0;border-radius:2px;clip-path:var(--chamfer);padding:.6rem 1.15rem;min-height:40px;cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-family:var(--head);font-weight:650;font-size:.92rem;line-height:1.2;
  background:var(--gold);color:#0B0A10;transition:background-color .15s ease,transform .12s var(--ease),opacity .15s ease}
.btn:active:not(:disabled){transform:scale(.97);background:var(--gold-lo)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--raised-2);color:var(--text)}
.btn.ghost:active:not(:disabled){background:var(--steel)}
.btn.purple{background:var(--purple);color:#fff}
.btn.danger{background:rgba(240,122,115,.12);color:var(--bad)}
.btn.sm{padding:.36rem .7rem;min-height:32px;font-size:.84rem}

/* Forms (16px so iPhones don't zoom) */
input,select,textarea{background:var(--black);border:1px solid var(--edge-strong);border-radius:6px;padding:.6rem .75rem;width:100%;font-size:16px;
  transition:border-color .15s ease,box-shadow .15s ease}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(203,161,53,.14);outline:none}
input[type=checkbox]{width:auto;accent-color:#CBA135}
label{display:block;font-family:var(--head);font-stretch:85%;font-size:.76rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 .35rem}
.field{margin-bottom:1rem}
.help{font-size:.82rem;color:var(--dim);margin-top:.3rem}
.dim{color:var(--dim)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:.8rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}

/* Type */
h2{font-family:var(--display);font-stretch:118%;font-weight:750;font-size:clamp(1.6rem,3vw,2.1rem);letter-spacing:-.02em;margin:0 0 1.2rem;line-height:1.05;text-wrap:balance}
h3{font-family:var(--head);font-weight:650;font-size:1.05rem;letter-spacing:-.01em;margin:0 0 .75rem}
.panel{padding:1.1rem 1.2rem}
.empty{padding:2.2rem 1rem;text-align:center;color:var(--dim)}
.err-text{color:var(--bad);font-size:.9rem;margin-top:.5rem}
.pts{font-family:var(--head);font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.plus{color:var(--good)} .minus{color:var(--bad)}

/* Tables */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:var(--head);font-stretch:85%;font-weight:650;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:.55rem .6rem;border-bottom:1px solid var(--edge)}
td{padding:.65rem .6rem;border-bottom:1px solid var(--edge);vertical-align:top;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
.scroll{overflow-x:auto}

/* Chips */
.chip{display:inline-flex;align-items:center;font-family:var(--head);font-size:.74rem;font-weight:600;padding:.08rem .5rem;border-radius:6px;background:var(--raised-2);color:var(--dim);white-space:nowrap;line-height:1.5}
.chip.gold,.chip.active{background:var(--gold-soft);color:var(--gold)}
.chip.purple,.chip.applied{background:var(--purple-soft);color:#D6B4F0}
.chip.good,.chip.used{background:rgba(95,191,122,.13);color:var(--good)}
.chip.bad,.chip.void{background:rgba(240,122,115,.13);color:var(--bad)}
.chip.warn{background:rgba(232,163,60,.13);color:var(--warn)}

/* Brand mark: logo, with a gold hex as the fallback */
.mark{display:flex;align-items:center;gap:.8rem;margin-bottom:1.6rem}
.mark img{height:38px;width:auto;display:block}
.mark .bolt{display:none}
.mark img.broken{display:none}
.mark img.broken + .bolt{display:grid}
.bolt{width:40px;height:40px;flex:none;clip-path:var(--hex);background:var(--gold);place-items:center}
.bolt::after{content:'';width:42%;height:42%;clip-path:var(--hex);background:var(--black)}
.mark h1{font-family:var(--display);font-stretch:118%;font-weight:750;font-size:1.3rem;letter-spacing:-.01em;margin:0;line-height:1}
.mark small{display:block;color:var(--gold);font-family:var(--head);font-stretch:80%;font-size:.72rem;font-weight:650;letter-spacing:.14em;text-transform:uppercase;margin-top:.25rem}

/* Login */
#login{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:1.5rem;
  background:radial-gradient(80% 60% at 100% 0%,rgba(107,40,150,.28),transparent 60%),var(--black)}
#login form{width:100%;max-width:400px;padding:2rem 1.8rem}
#login .btn{width:100%;min-height:48px;font-size:1rem}
.keep{display:flex;gap:.55rem;align-items:center;font-size:.88rem;color:var(--dim);margin:-.2rem 0 1.1rem;text-transform:none;letter-spacing:0;font-weight:400}
.keep input{width:18px;height:18px}

/* Shell */
#app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
nav{border-right:1px solid var(--edge);padding:1.2rem .75rem;background:var(--iron);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
nav .mark{margin:0 .45rem 1.4rem}
nav .grp{font-family:var(--head);font-stretch:80%;font-size:.7rem;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:1rem .8rem .35rem}
nav button.tab{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:6px;
  padding:.55rem .8rem;margin-bottom:.1rem;cursor:pointer;font-family:var(--head);font-size:.95rem;font-weight:500;color:var(--dim);transition:color .15s ease,background-color .15s ease}
nav button.tab.on{color:var(--text);background:var(--raised-2)}
nav button.tab.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--gold)}
.count{background:var(--gold);color:#0B0A10;border-radius:999px;font-size:.72rem;font-weight:700;padding:0 .45rem;font-family:var(--body);font-variant-numeric:tabular-nums}
nav .who{margin-top:auto;padding:.9rem .8rem 0;font-size:.85rem;color:var(--dim);border-top:1px solid var(--edge)}
main{padding:1.8rem 2rem 5rem;min-width:0}

/* Jobs board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:.75rem;overflow-x:auto;padding-bottom:.6rem}
.col{background:var(--iron);border:1px solid var(--edge);border-radius:12px;padding:.6rem;min-height:120px}
.col h4{font-family:var(--head);font-stretch:85%;font-weight:650;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;margin:.2rem .3rem .65rem;display:flex;justify-content:space-between;color:var(--faint)}
.col h4 b{color:var(--text);font-weight:650;font-variant-numeric:tabular-nums}
.card{display:block;width:100%;text-align:left;background:var(--steel);border:1px solid var(--edge);border-radius:8px;padding:.7rem .75rem;margin-bottom:.5rem;cursor:pointer;color:var(--text);
  transition:border-color .15s ease,transform .12s var(--ease)}
.card:active{transform:scale(.985)}
.selbar{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;position:sticky;top:0;z-index:5;background:var(--raised);border:1px solid var(--gold);border-radius:8px;padding:.55rem .7rem;margin-bottom:.8rem}
.selbar #selN{font-weight:650;color:var(--gold);font-variant-numeric:tabular-nums}
.card.picked{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:var(--gold-soft)}
.card.picked .t::before{content:'\2713  ';color:var(--gold)}
tr.mpicked td{background:var(--gold-soft)}
.convo{display:flex;gap:.7rem;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--edge);padding:.8rem .4rem;color:var(--text);cursor:pointer;font:inherit}
.convo:hover{background:var(--raised-2)}
.convo .av{flex:0 0 38px;height:38px;border-radius:50%;background:var(--purple-soft);color:#D6B4F0;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700}
.convo .mid{flex:1;min-width:0}.convo .mid b{display:block}.convo .mid span{display:block;color:var(--dim);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo.unread .mid b,.convo.unread .mid span{color:var(--text);font-weight:650}
.convo .ub{background:var(--gold);color:#0B0A10;border-radius:999px;font-size:.75rem;font-weight:700;padding:.05rem .45rem}
#thread{display:flex;flex-direction:column;gap:.45rem;max-height:56vh;overflow-y:auto;padding:.4rem .2rem 1rem}
.bub{max-width:82%;padding:.55rem .75rem;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;font-size:.95rem;line-height:1.4}
.bub.in{align-self:flex-start;background:var(--raised-2);border-bottom-left-radius:4px}
.bub.out{align-self:flex-end;background:var(--purple);color:#fff;border-bottom-right-radius:4px}
.bub small{display:block;font-size:.72rem;opacity:.7;margin-top:.2rem}
.tday{align-self:center;font-size:.75rem;color:var(--dim);margin:.4rem 0}
.composer{display:flex;gap:.5rem;align-items:flex-end;position:sticky;bottom:0;background:var(--iron);padding:.6rem 0}
.composer textarea{flex:1;min-height:44px;max-height:160px;resize:vertical}

#mselBar [data-bulk]:disabled,#mClear:disabled{opacity:.45}
.card .t{font-family:var(--head);font-weight:650;font-size:.96rem;line-height:1.25}
.card .s{font-size:.83rem;color:var(--dim);margin-top:.2rem;line-height:1.4}
.card .f{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.5rem}

/* Today */
.day{display:grid;gap:.75rem}
.stop{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:1rem;align-items:start;padding:1rem 1.1rem}
.stop .when{font-family:var(--display);font-stretch:118%;font-weight:750;font-size:1.25rem;line-height:1.05;color:var(--gold);font-variant-numeric:tabular-nums}
.stop .when small{display:block;font-family:var(--body);font-stretch:100%;font-weight:400;font-size:.78rem;color:var(--dim);margin-top:.2rem}
.stop .who{font-family:var(--head);font-weight:650;font-size:1.05rem}
.stop .acts{display:flex;flex-direction:column;gap:.4rem;min-width:124px}

/* Job drawer */
#drawer{position:fixed;inset:0;background:rgba(6,4,10,.72);display:flex;justify-content:flex-end;z-index:20}
#drawer .sheet{width:min(800px,100%);height:100%;overflow-y:auto;background:var(--iron);border-left:1px solid var(--edge-strong);padding:1.3rem 1.5rem 4rem;overscroll-behavior:contain}
.dtabs{display:flex;gap:.2rem;border-bottom:1px solid var(--edge);margin:1rem 0;position:sticky;top:-1.3rem;background:var(--iron);z-index:2;padding-top:.4rem;overflow-x:auto}
.dtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:.55rem .85rem;font-family:var(--head);font-weight:600;font-size:.92rem;color:var(--dim);cursor:pointer;white-space:nowrap;transition:color .15s ease}
.dtabs button.on{color:var(--text);border-bottom-color:var(--gold)}
.kv{display:grid;grid-template-columns:132px minmax(0,1fr);gap:.4rem .9rem;font-size:.93rem}
.kv dt{color:var(--dim)} .kv dd{margin:0;overflow-wrap:anywhere}
.sec{margin-bottom:1.1rem}

/* Estimates */
.est td{padding:.4rem .3rem;border-bottom:1px solid var(--edge)}
.est input,.est select{padding:.42rem .5rem;font-size:16px}
.est .amt{font-family:var(--head);font-weight:650;text-align:right;white-space:nowrap;padding-top:.65rem}
.totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.totals table td{border:0;padding:.2rem .2rem}
.totals .big td{font-family:var(--head);font-weight:700;font-size:1.1rem;color:var(--gold);border-top:1px solid var(--edge);padding-top:.45rem}
.ev{display:grid;grid-template-columns:118px minmax(0,1fr);gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--edge);font-size:.9rem}
.ev .k{font-family:var(--head);font-stretch:85%;font-weight:650;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}

/* Loyalty tier */
.tierline{display:flex;align-items:center;gap:1rem;margin:1rem 0}
.tierline .bolt{width:60px;height:60px;display:grid}
.tierline .bolt::after{display:none}
.tierline .bolt b{font-family:var(--display);font-weight:750;color:#0B0A10;font-size:.95rem}
.bar{height:6px;background:var(--black);border:1px solid var(--edge);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}

/* Overview numbers */
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--edge);border-radius:12px;overflow:hidden;margin-bottom:1rem;background:var(--iron)}
.gauge{padding:1.15rem 1.25rem}
.gauge + .gauge{border-left:1px solid var(--edge)}
.gauge b{display:block;font-family:var(--display);font-stretch:118%;font-weight:750;font-size:2rem;line-height:1.05;color:var(--gold);font-variant-numeric:tabular-nums}
.gauge span{font-family:var(--head);color:var(--dim);font-size:.88rem}
.gauge em{display:block;font-style:normal;font-size:.8rem;color:var(--faint);margin-top:.3rem}
.settings table input{padding:.4rem .5rem}

/* Labor guide picker */
.gres{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.75rem;align-items:start;padding:.85rem .25rem;border-bottom:1px solid var(--edge)}
.gres:last-child{border-bottom:0}
.gres h4{margin:0;font-family:var(--head);font-weight:650;font-size:.98rem}
.gres .meta{font-size:.83rem;color:var(--dim);margin-top:.2rem}
.gres .price{font-family:var(--head);font-weight:700;color:var(--gold);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.gacts{display:flex;flex-direction:column;align-items:flex-end;gap:.35rem}
.gpick{border:1px solid var(--edge-strong);border-radius:12px;padding:.9rem;margin:.7rem 0;background:var(--black)}
.gpick .list{max-height:440px;overflow-y:auto;margin-top:.55rem}
.plinks{white-space:normal}
.plinks a{font-weight:600;text-decoration:none;border-bottom:1px solid rgba(203,161,53,.35)}
.btbox{margin-top:.6rem;padding:.7rem .8rem;border-radius:8px;background:var(--steel);border:1px solid var(--edge)}
.bthead{font-size:.85rem;color:var(--dim);margin-bottom:.4rem}
.bthead b{color:var(--text)}
.btrow{display:flex;justify-content:space-between;gap:.75rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--edge)}
.btrow b{color:var(--gold);font-variant-numeric:tabular-nums}
.parts-ed td{padding:.3rem .2rem;border:0}
.parts-ed input{padding:.4rem .5rem}

/* Price check, inspections, clock, vehicles */
.supgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.4rem}
.supgrid .btn{width:100%}
.insrow{display:grid;grid-template-columns:minmax(150px,1.1fr) auto minmax(160px,1.4fr);gap:.6rem .8rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--edge)}
.insrow:last-child{border-bottom:0}
.insname{font-weight:600}
.insph{grid-column:1/-1;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.insph:empty{display:none}
.seg{display:inline-flex;border:1px solid var(--edge-strong);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;border-right:1px solid var(--edge);color:var(--dim);font:inherit;font-size:.82rem;font-weight:600;padding:.45rem .65rem;min-height:38px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on.good{background:rgba(95,191,122,.18);color:var(--good)}
.seg button.on.watch{background:rgba(232,163,60,.18);color:var(--warn)}
.seg button.on.bad{background:rgba(240,122,115,.18);color:var(--bad)}
.seg button.on.na{background:var(--raised-2);color:var(--text)}
.insnote{min-height:38px;padding:.45rem .6rem}
.ph{position:relative;display:inline-block}
.ph img{width:84px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--edge);display:block}
.ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#0B0A10;font-weight:800;cursor:pointer;line-height:1}
.addph{cursor:pointer}
.clock{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-top:.8rem;padding:.55rem .7rem;border:1px solid var(--edge);border-radius:8px;background:var(--steel)}
.cnote{margin-top:.6rem;padding:.55rem .7rem;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:6px;font-size:.9rem}
.veh{padding:.75rem 0;border-bottom:1px solid var(--edge)}
.veh:last-child{border-bottom:0}
@media (max-width:900px){.insrow{grid-template-columns:1fr}.seg{width:100%}.seg button{flex:1}}

/* ── Calendar ── */
.calhead{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
.calbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.caltitle{flex:1;font-family:var(--display);font-stretch:110%;font-weight:700;font-size:1.25rem;letter-spacing:-.01em;min-width:9rem}
.calmode button{min-height:36px;padding:.35rem .8rem}
#calGrid{padding:0;overflow:hidden;border-radius:12px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cdow{font-family:var(--head);font-stretch:85%;font-size:.7rem;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:.55rem .5rem;border-bottom:1px solid var(--edge)}
.cday{min-height:112px;padding:.35rem .35rem .45rem;border-right:1px solid var(--edge);border-bottom:1px solid var(--edge);cursor:pointer;min-width:0;transition:background-color .15s ease}
.cday:nth-child(7n+7){border-right:0}
.cgrid.week .cday{min-height:300px}
.cday.out{background:rgba(0,0,0,.18)}.cday.out .cnum{color:var(--faint)}
.cday.sel{background:var(--raised-2)}
.cnum{font-variant-numeric:tabular-nums;font-weight:600;font-size:.85rem;color:var(--dim);width:26px;height:26px;display:grid;place-items:center;border-radius:50%;margin-bottom:.2rem}
.cday.today .cnum{background:var(--gold);color:#0B0A10}
.cev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--purple,#6B2896);background:rgba(107,40,150,.22);color:var(--text);font:inherit;font-size:.74rem;line-height:1.25;
  padding:.2rem .35rem;border-radius:4px;margin-bottom:.18rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cev span{color:var(--dim);font-variant-numeric:tabular-nums}
.cev.live{border-left-color:var(--gold);background:var(--gold-soft)}
.cev.rush{border-left-color:var(--bad);background:rgba(240,122,115,.14)}

var OWN = function(){ return isRole('owner'); };
var TYPE = {earn:'Service',welcome:'Welcome',referral:'Referral',review:'Review',redeem:'Redeemed',void:'Returned',adjust:'Adjustment',refund:'Refund',bonus:'Bonus',expire:'Expired'};
var STAGE_CHIP = {new:'gold',scheduled:'',en_route:'purple',on_site:'purple',waiting_approval:'warn',waiting_parts:'warn',in_progress:'purple',completed:'good'};
var STAGES = [['new','New'],['scheduled','Scheduled'],['en_route','On the way'],['on_site','On site'],['waiting_approval','Waiting on approval'],['waiting_parts','Waiting on parts'],['in_progress','Working'],['completed','Done, not paid']];
function stageLabel(k){ for(var i=0;i<STAGES.length;i++) if(STAGES[i][0]===k) return STAGES[i][1]; return k; }
function stageChip(j){
  if(j.status==='paid') return '<span class="chip good">Paid</span>';
  if(j.status==='cancelled') return '<span class="chip bad">Cancelled</span>';
  return '<span class="chip '+(STAGE_CHIP[j.stage]||'')+'">'+esc(stageLabel(j.stage))+'</span>';
}
function fe(f, n){ return f.querySelector('[name="'+n+'"]'); }
function fill(tpl, v){ return String(tpl||'').replace(/\{(\w+)\}/g, function(m,k){ return v[k]!=null?String(v[k]):''; }).replace(/\s{2,}/g,' ').trim(); }

function toast(msg, err){
  var t=$('#toast'); t.textContent=msg; t.className=err?'err':''; clearTimeout(t._h);
  t._h=setTimeout(function(){ t.className='hide'; }, 3500);
}
function api(path, opts){
  opts = opts || {};
  return fetch(API + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+(S.token||'') },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if (r.status===401 && path!=='/admin/login') { signOut(); throw new Error(d.error||'Signed out'); }
      if (!r.ok) throw new Error(d.error || ('Request failed ('+r.status+')'));
      return d;
    });
  });
}
function busy(btn, on, label){ if(!btn) return; if(on){ btn._t=btn.textContent; btn.disabled=true; btn.textContent=label||'Working…'; } else { btn.disabled=false; if(btn._t) btn.textContent=btn._t; } }

/* ───────── auth ───────── */
function signOut(){
  try{ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(ME_KEY); }catch(e){}
  S.token=null; S.me=null; $('#drawer').classList.add('hide');
  $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#em').focus();
}
$('#loginForm').addEventListener('submit', function(e){
  e.preventDefault(); $('#loginErr').textContent='';
  var b=e.target.querySelector('button'); busy(b,true,'Signing in…');
  api('/admin/login',{method:'POST',body:{email:$('#em').value,password:$('#pw').value}}).then(function(d){
    S.token=d.token; S.me=d.staff;
    try{ localStorage.setItem(TOKEN_KEY,d.token); localStorage.setItem(ME_KEY,JSON.stringify(d.staff)); }catch(e){}
    $('#pw').value=''; start();
  }).catch(function(err){ $('#loginErr').textContent=err.message; }).then(function(){ busy(b,false); });
});

  {grp:'Work'},
  {tab:'today', label:function(){ return isRole('tech')?'My day':'Today'; }, roles:['owner','writer','tech']},
  {tab:'jobs', label:function(){ return isRole('tech')?'My jobs':'Jobs'; }, roles:['owner','writer','tech'], count:'cJobs'},
  {tab:'calendar', label:'Calendar', roles:['owner','writer','tech']},
  {tab:'new', label:'New job', roles:['owner','writer']},
  {tab:'guide', label:'Quotes & labor guide', roles:['owner','writer']},
  {tab:'followups', label:'Follow-ups', roles:['owner','writer'], count:'cFollow'},
  {tab:'reminders', label:'Service reminders', roles:['owner','writer'], count:'cRem'},
  {grp:'Customers', roles:['owner','writer']},
  {tab:'messages', label:'Messages', roles:['owner','writer'], count:'cMsg'},
  {tab:'customers', label:'Customers', roles:['owner','writer']},
  {tab:'promos', label:'Promotions', roles:['owner','writer']},
  {tab:'vouchers', label:'Reward vouchers', roles:['owner','writer'], count:'cVouchers'},
  {tab:'points', label:'Add points', roles:['owner']},
  {grp:'Business', roles:['owner','writer']},
  {tab:'overview', label:'Shop overview', roles:['owner','writer']},
  {tab:'books', label:'Books', roles:['owner']},
  {tab:'staff', label:'Team & access', roles:['owner']},
  {tab:'settings', label:'Settings', roles:['owner']},
  {grp:'You'},
  {tab:'account', label:'My account', roles:['owner','writer','tech']}
];
function buildNav(){
  var r=S.me.role, h='<div class="mark"><img src="https://ueauto.store/cdn/shop/t/5/assets/uea-logo_1.png" alt="Upper Echelon Automotive" width="152" height="38" onerror="this.className=\'broken\'"><div class="bolt"></div></div>';
  NAV.forEach(function(it){
    if(it.roles && it.roles.indexOf(r)<0) return;
    if(it.grp){ h+='<div class="grp">'+it.grp+'</div>'; return; }
    var lab=typeof it.label==='function'?it.label():it.label;
    h+='<button class="tab" data-tab="'+it.tab+'">'+esc(lab)+(it.count?' <span class="count hide" id="'+it.count+'"></span>':'')+'</button>';
  });
  h+='<div class="who">'+esc(S.me.name)+'<br>'+esc({owner:'Owner',writer:'Service writer',tech:'Technician'}[r])+'</div>';
  $('#nav').innerHTML=h;
  $$('#nav .tab').forEach(function(b){ b.addEventListener('click', function(){ go(b.dataset.tab); }); });
  // Phone: bottom bar with the 4 most-used screens + More
  var allowed=NAV.filter(function(it){ return it.tab && (!it.roles||it.roles.indexOf(r)>-1); });
  var has=function(t){ return allowed.some(function(it){ return it.tab===t; }); };
  var IC={today:'<path d="M4 6h16M4 12h10M4 18h7"/>',jobs:'<rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="10" rx="1.5"/>',
    'new':'<path d="M12 5v14M5 12h14"/>',customers:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>',
    calendar:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    guide:'<path d="M6 3h9l3 3v15H6z"/><path d="M9 11h6M9 15h6"/>',more:'<circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/>'};
  var main=['today','jobs','new','calendar'].filter(has);
  if(main.length<4 && has('guide')) main.push('guide');
  var lab=function(t){ var it=allowed.filter(function(x){ return x.tab===t; })[0]; var l=typeof it.label==='function'?it.label():it.label; return {'Quotes & labor guide':'Quotes','New job':'New'}[l]||l; };
  var ico=function(k){ return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(IC[k]||IC.more)+'</svg>'; };
  $('#bnav').innerHTML=main.map(function(t){ return '<button class="bt'+(t==='new'?' plus':'')+'" data-tab="'+t+'">'+ico(t)+'<span>'+esc(lab(t))+'</span>'+(t==='jobs'?'<i class="bc hide" data-cnt="cJobs"></i>':'')+'</button>'; }).join('')+
    '<button class="bt" id="bMore">'+ico('more')+'<span>More</span><i class="bc hide" data-cnt="more"></i></button>';
  $$('#bnav [data-tab]').forEach(function(b){ b.addEventListener('click', function(){ go(b.dataset.tab); window.scrollTo(0,0); }); });
  var rest=NAV.filter(function(it){ return !it.roles||it.roles.indexOf(r)>-1; });
  var mh='<div class="mgrab" aria-hidden="true"></div><div class="mwho">'+esc(S.me.name)+' · '+esc({owner:'Owner',writer:'Service writer',tech:'Technician'}[r])+'</div>';
  rest.forEach(function(it){
    if(it.grp){ mh+='<div class="grp">'+it.grp+'</div>'; return; }
    if(main.indexOf(it.tab)>-1) return;
    var l=typeof it.label==='function'?it.label():it.label;
    mh+='<button class="mi" data-tab="'+it.tab+'"><span>'+esc(l)+'</span>'+(it.count?'<i class="bc hide" data-cnt="'+it.count+'"></i>':'')+'<b aria-hidden="true">›</b></button>';
  });
  mh=mh.replace(/<div class="grp">[^<]*<\/div>(?=<div class="grp">|$)/g,'');
  $('#moreSheet').innerHTML=mh;
  $$('#moreSheet [data-tab]').forEach(function(b){ b.addEventListener('click', function(){ $('#more').classList.add('hide'); go(b.dataset.tab); window.scrollTo(0,0); }); });
  $('#bMore').addEventListener('click', function(){ $('#more').classList.remove('hide'); });
  $('#more').addEventListener('click', function(e){ if(e.target.id==='more') $('#more').classList.add('hide'); });
}
function start(){
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  buildNav(); go(S.tab||'today'); refreshCounts();
  api('/admin/me').then(function(d){ S.me=d.staff; try{ localStorage.setItem(ME_KEY,JSON.stringify(d.staff)); }catch(e){} }).catch(function(){});
}
function setCount(id, v){ var el=$('#'+id); if(el){ el.textContent=v; el.classList.toggle('hide', !v); }
  $$('[data-cnt="'+id+'"]').forEach(function(b){ b.textContent=v; b.classList.toggle('hide', !v); });
  S.cnt=S.cnt||{}; S.cnt[id]=v; var m=(S.cnt.cFollow||0)+(S.cnt.cRem||0)+(S.cnt.cVouchers||0)+(S.cnt.cMsg||0);
  $$('[data-cnt="more"]').forEach(function(b){ b.textContent=m; b.classList.toggle('hide', !m); }); }
function refreshCounts(){
  api('/admin/jobs?view=open').then(function(d){ setCount('cJobs', d.jobs.length); }).catch(function(){});
  if(DESK()){
    api('/admin/followups').then(function(d){ setCount('cFollow', d.followups.filter(function(f){return f.due;}).length); }).catch(function(){});
    api('/admin/vouchers?status=open').then(function(d){ setCount('cVouchers', d.vouchers.length); }).catch(function(){});
    api('/admin/reminders?view=due').then(function(d){ setCount('cRem', d.reminders.length); }).catch(function(){});
    refreshMsgCount();
  }
}
function refreshMsgCount(){
  return api('/admin/messages').then(function(d){
    var before=(S.cnt&&S.cnt.cMsg)||0; setCount('cMsg', d.unread); S.convos=d.conversations;
    if(d.unread>before && S.msgReady) toast('New text from a customer');
    S.msgReady=true; return d;
  }).catch(function(){});
}
// Check for new customer texts every 30 seconds while the desk is open.
setInterval(function(){
  if(!S.token||!S.me||!DESK()||document.hidden) return;
  refreshMsgCount().then(function(){
    if(S.tab==='messages'&&$('#convList')&&!S.thread) paintConvos();
    if(S.thread&&$('#thread')) loadThread(S.thread,true);
  });
}, 30000);
var VIEWS = {};
function go(tab){
  var allowed=$$('#nav .tab').map(function(b){ return b.dataset.tab; });
  if(allowed.indexOf(tab)<0) tab='today';
  S.tab=tab; $$('#nav .tab, #bnav [data-tab]').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===tab); });
  if($('#bMore')) $('#bMore').classList.toggle('on', !$('#bnav [data-tab="'+tab+'"]'));
  if(tab!=='jobs') S.sel=null;
  S.thread=null;
  $('#view').innerHTML='<div class="empty">Loading…</div>';
  VIEWS[tab]();
}
function fail(err){ $('#view').innerHTML='<div class="empty">'+esc(err.message)+'</div>'; }
function rerender(){ if(VIEWS[S.tab]) VIEWS[S.tab](); refreshCounts(); }

/* ───────── TODAY ───────── */
VIEWS.today = function(){
  var tech=isRole('tech');
  Promise.all([api('/admin/jobs?view=today'), DESK()?api('/admin/jobs?view=open'):Promise.resolve(null), DESK()?api('/admin/techs'):Promise.resolve({techs:[]})]).then(function(r){
    var d=r[0], open=r[1], techs=r[2].techs, today=d.today;
    var unsched = open ? open.jobs.filter(function(j){ return !j.sched_date; }) : [];
    var waiting = open ? open.jobs.filter(function(j){ return j.stage==='waiting_approval'; }) : [];
    var unpaid = open ? open.jobs.filter(function(j){ return j.stage==='completed'; }) : [];
    var h='<h2>'+(tech?'My day':'Today')+'</h2><p class="dim" style="margin:-.7rem 0 1rem">'+dayLabel(today)+'</p>';
    if(DESK()){
      h+='<div class="grid g3" style="margin-bottom:1rem">'+
        miniLink('Need scheduling', unsched.length, 'jobs')+miniLink('Waiting on customer approval', waiting.length, 'jobs')+miniLink('Done but not paid', unpaid.length, 'jobs')+'</div>';
      if(techs.length) h+='<div class="row" style="margin-bottom:.8rem"><select id="tFilter" style="width:auto"><option value="">Everyone</option><option value="none">Unassigned</option>'+techs.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'</option>';}).join('')+'</select></div>';
    }
    h+='<div class="day" id="dayList"></div>';
    $('#view').innerHTML=h;
    $$('[data-goto]').forEach(function(b){ b.addEventListener('click', function(){ go(b.dataset.goto); }); });
    function paint(filter){
      var jobs=d.jobs.filter(function(j){ return !filter || (filter==='none'?!j.tech_id:j.tech_id===filter); });
      $('#dayList').innerHTML = jobs.length ? jobs.map(function(j){
        var late=j.sched_date && j.sched_date<today;
        return '<div class="steel stop"><div class="when">'+esc(j.sched_window||'Any time')+(late?'<small style="color:var(--warn)">From '+dayLabel(j.sched_date)+'</small>':'')+'</div>'+
          '<div><div class="who">'+esc(j.customer_name||'Customer')+' '+stageChip(j)+(j.rush?' <span class="chip bad">Rush</span>':'')+'</div>'+
          '<div>'+esc(j.service||'')+(j.vehicle?' <span class="dim">on '+esc(j.vehicle)+'</span>':'')+'</div>'+
          (j.address?'<div class="dim" style="font-size:.88rem">'+esc(j.address)+'</div>':'')+
          (DESK()?'<div class="dim" style="font-size:.85rem">'+(j.tech?esc(j.tech.name):'<span style="color:var(--warn)">Unassigned</span>')+'</div>':'')+'</div>'+
          '<div class="acts">'+(j.address?'<a class="btn ghost sm" target="_blank" rel="noopener" href="'+mapHref(j.address)+'">Navigate</a>':'')+
          (j.phone?'<a class="btn ghost sm" href="'+telHref(j.phone)+'">Call</a>':'')+
          '<button class="btn sm" data-job="'+j.id+'">Open job</button></div></div>';
      }).join('') : '<div class="steel empty">'+(tech?'Nothing assigned to you today.':'Nothing scheduled for today.')+(DESK()&&unsched.length?' <a href="#" data-goto="jobs">'+unsched.length+' job'+(unsched.length>1?'s':'')+' need scheduling.</a>':'')+'</div>';
      $$('#dayList [data-job]').forEach(function(b){ b.addEventListener('click', function(){ openJob(b.dataset.job); }); });
      $$('#dayList [data-goto]').forEach(function(b){ b.addEventListener('click', function(e){ e.preventDefault(); go(b.dataset.goto); }); });
    }
    paint('');
    if($('#tFilter')) $('#tFilter').addEventListener('change', function(){ paint(this.value); });
  }).catch(fail);
};
function miniLink(label, v, tab){ return '<button class="steel panel" data-goto="'+tab+'" style="text-align:left;cursor:pointer;color:var(--text)"><div class="dim" style="font-family:var(--head);font-size:.85rem">'+label+'</div><div style="font-family:var(--display);font-size:2rem;line-height:1.1;color:'+(v?'var(--gold-hi)':'var(--text)')+'">'+n(v)+'</div></button>'; }

/* ───────── JOBS BOARD ───────── */
VIEWS.jobs = function(){
  var h='<h2>'+(isRole('tech')?'My jobs':'Jobs')+'</h2><div class="row" style="margin-bottom:1rem">'+
    '<div class="row" role="tablist"><button class="btn sm '+(S.jobsView==='board'?'':'ghost')+'" data-jv="board">Open jobs</button><button class="btn sm '+(S.jobsView==='history'?'':'ghost')+'" data-jv="history">Paid & cancelled</button></div>'+
    '<input id="jq" placeholder="Search name, phone, VIN, order #, address" style="flex:1;min-width:200px">'+
    (DESK()?'<select id="jt" style="width:auto"><option value="">Everyone</option><option value="none">Unassigned</option></select>'+(S.jobsView==='board'?'<button class="btn ghost sm" id="selMode">'+(S.sel?'Done selecting':'Select jobs')+'</button>':'')+'<button class="btn purple sm" data-goto="new">New job</button>':'')+
    '</div>'+(S.sel&&S.jobsView==='board'?'<div class="selbar" id="selBar"><span id="selN">0 selected</span><button class="btn ghost sm" id="selPast">Select all with past dates</button><button class="btn ghost sm" id="selAll">Select all</button><button class="btn ghost sm" id="selNone">Clear</button><span style="flex:1"></span><button class="btn sm" id="selFinish" disabled>Mark finished</button><button class="btn danger sm" id="selCancel" disabled>Cancel jobs</button></div>':'')+
    '<div id="jlist"></div>';
  $('#view').innerHTML=h;
  $$('[data-jv]').forEach(function(b){ b.addEventListener('click', function(){ S.jobsView=b.dataset.jv; S.sel=null; VIEWS.jobs(); }); });
  if($('#selMode')) $('#selMode').addEventListener('click', function(){ S.sel=S.sel?null:{}; VIEWS.jobs(); });
  if(S.sel&&$('#selBar')){
    var pick=function(test){ S.sel={}; (S.lastJobs||[]).forEach(function(j){ if(test(j)) S.sel[j.id]=1; }); paintSel(); };
    $('#selPast').addEventListener('click', function(){ var t=new Date().toLocaleDateString('en-CA',{timeZone:'America/Chicago'}); pick(function(j){ return j.sched_date && j.sched_date<t; }); });
    $('#selAll').addEventListener('click', function(){ pick(function(){ return true; }); });
    $('#selNone').addEventListener('click', function(){ pick(function(){ return false; }); });
    var bulk=function(action, btn){
      var ids=Object.keys(S.sel); if(!ids.length) return;
      var msg=action==='finish'?'Mark '+ids.length+' job'+(ids.length>1?'s':'')+' as finished? They move to "Paid & cancelled". No charge is recorded and no points are added.':'Cancel '+ids.length+' job'+(ids.length>1?'s':'')+'?';
      if(!confirm(msg)) return;
      busy(btn,true,'Working…');
      api('/admin/jobs/bulk',{method:'POST',body:{ids:ids,action:action}}).then(function(r){
        toast(r.done+' job'+(r.done===1?'':'s')+(action==='finish'?' marked finished':' cancelled')); S.sel={}; busy(btn,false); loadJobs(); refreshCounts();
      }).catch(function(e){ busy(btn,false); toast(e.message,true); });
    };
    $('#selFinish').addEventListener('click', function(){ bulk('finish', this); });
    $('#selCancel').addEventListener('click', function(){ bulk('cancel', this); });
  }
  $$('[data-goto]').forEach(function(b){ b.addEventListener('click', function(){ go(b.dataset.goto); }); });
  if(DESK()) api('/admin/techs').then(function(d){ $('#jt').insertAdjacentHTML('beforeend', d.techs.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'</option>';}).join('')); });
  var t; $('#jq').addEventListener('input', function(){ clearTimeout(t); t=setTimeout(loadJobs, 250); });
  if($('#jt')) $('#jt').addEventListener('change', loadJobs);
  loadJobs();
};
function loadJobs(){
  var q=$('#jq').value, tech=$('#jt')?$('#jt').value:'';
  var hist=S.jobsView==='history';
  api('/admin/jobs?view='+(hist?'history':'open')+'&q='+encodeURIComponent(q)+'&tech='+encodeURIComponent(tech)).then(function(d){
    if(hist){
      $('#jlist').innerHTML = d.jobs.length ? '<div class="steel scroll"><table><tr><th>Job</th><th>Customer</th><th>Service</th><th>Status</th></tr>'+d.jobs.map(function(j){
        return '<tr class="click" data-job="'+j.id+'"><td><b style="font-family:var(--head)">'+esc(j.order_name||'Phone job')+'</b><div class="dim" style="font-size:.8rem">'+when(j.paid_at||j.created_at)+'</div></td><td>'+esc(j.customer_name||j.email||'')+'</td><td>'+esc(j.service||'')+'<div class="dim" style="font-size:.82rem">'+esc(j.vehicle||'')+'</div></td><td>'+stageChip(j)+(j.status==='paid'?'<div class="dim" style="font-size:.82rem">'+usd(j.total_cents)+'</div>':'')+'</td></tr>';
      }).join('')+'</table></div>' : '<div class="steel empty">No paid or cancelled jobs match.</div>';
    } else {
      var cols=STAGES.map(function(s){ return {k:s[0], l:s[1], jobs:d.jobs.filter(function(j){ return j.stage===s[0]; })}; });
      if(isRole('tech')) cols=cols.filter(function(c){ return c.jobs.length || ['scheduled','on_site','in_progress'].indexOf(c.k)>-1; });
      if(PHONE()){
        var f=S.stageF||'all'; if(f!=='all' && !cols.some(function(c){ return c.k===f && c.jobs.length; })) f='all';
        var shown=cols.filter(function(c){ return c.jobs.length && (f==='all'||c.k===f); });
        $('#jlist').innerHTML='<div class="schips" role="tablist"><button class="schip'+(f==='all'?' on':'')+'" data-sf="all">All <b>'+d.jobs.length+'</b></button>'+
          cols.filter(function(c){ return c.jobs.length; }).map(function(c){ return '<button class="schip'+(f===c.k?' on':'')+'" data-sf="'+c.k+'">'+esc(c.l)+' <b>'+c.jobs.length+'</b></button>'; }).join('')+'</div>'+
          (shown.length?shown.map(function(c){ return (f==='all'?'<h4 class="lhead">'+esc(c.l)+' <span>'+c.jobs.length+'</span></h4>':'')+c.jobs.map(card).join(''); }).join(''):'<div class="steel empty">No open jobs'+($('#jq').value?' match your search':'')+'.</div>');
        $$('[data-sf]').forEach(function(b){ b.addEventListener('click', function(){ S.stageF=b.dataset.sf; loadJobs(); }); });
        cols=null;
      }
      if(cols)
      $('#jlist').innerHTML = '<div class="board">'+cols.map(function(c){
        return '<div class="col"><h4><b>'+c.l+'</b><span>'+c.jobs.length+'</span></h4>'+(c.jobs.length?c.jobs.map(card).join(''):'<div class="dim" style="font-size:.82rem;padding:.3rem">None</div>')+'</div>';
      }).join('')+'</div>';
    }
    if(!hist) S.lastJobs=d.jobs;
    $$('#jlist [data-job]').forEach(function(el){ el.addEventListener('click', function(){
      if(S.sel&&!hist){ if(S.sel[el.dataset.job]) delete S.sel[el.dataset.job]; else S.sel[el.dataset.job]=1; paintSel(); }
      else openJob(el.dataset.job); }); });
    paintSel();
  }).catch(function(e){ $('#jlist').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
}
function paintSel(){
  if(!S.sel) return;
  var n=Object.keys(S.sel).length;
  $$('#jlist .card[data-job]').forEach(function(c){ c.classList.toggle('picked', !!S.sel[c.dataset.job]); c.setAttribute('aria-pressed', S.sel[c.dataset.job]?'true':'false'); });
  if($('#selN')) $('#selN').textContent=n+' selected';
  if($('#selFinish')){ $('#selFinish').disabled=!n; $('#selCancel').disabled=!n; }
}
function card(j){
  var est=j.estimate&&j.estimate.lines&&j.estimate.lines.length;
  return '<button class="card" data-job="'+j.id+'"><div class="t">'+esc(j.customer_name||'Customer')+'</div>'+

function fld(label, name, val, dis, type, mode){ return '<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+(type||'text')+'"'+(mode?' inputmode="'+mode+'"':'')+' value="'+esc(val==null?'':val)+'"'+(dis||'')+'></div>'; }
function decodeVin(vinInput, vehInput){
  var vin=(vinInput.value||'').toUpperCase().trim();
  if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) return toast('Enter the full 17-character VIN first', true);
  toast('Decoding VIN…');
  fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+vin+'?format=json').then(function(r){ return r.json(); }).then(function(d){
    var r=d.Results&&d.Results[0]; if(!r||!r.Make) throw new Error('VIN not recognized');
    var tc=function(s){ return String(s||'').toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase();}); };
    var eng=r.DisplacementL?(Math.round(parseFloat(r.DisplacementL)*10)/10)+'L':'';
    var v=[r.ModelYear, tc(r.Make), r.Model, r.Trim, eng].filter(Boolean).join(' ');
    if(vehInput && !vehInput.disabled) vehInput.value=v;
    vinInput.value=vin; toast('Decoded: '+v);
  }).catch(function(e){ toast('Could not decode: '+e.message, true); });
}

  $$('#estRows [data-prices]').forEach(function(btn){ btn.addEventListener('click', function(){

      onUse:function(r){ l.cost_cents=r.cost_cents; l.supplier=r.supplier; l.unit_cents=Math.round(r.cost_cents*(1+(Number(J.shop.parts_markup_pct)||0)/100)); paintLines(canEdit); toast('Price set. Save the estimate when done.'); }});
    $('#estPrices').scrollIntoView({block:'nearest'});
  }); });
  $$('#estRows [data-f]').forEach(function(inp){ inp.addEventListener('change', function(){
    var l=J.lines[+inp.dataset.i], f=inp.dataset.f;
    if(f==='type'){ l.type=inp.value; if(l.type==='discount') l.status='approved'; paintLines(canEdit); return; }
    if(f==='desc') l.desc=inp.value;
    if(f==='part_no') l.part_no=inp.value;
    if(f==='qty') l.qty=parseFloat(inp.value)||0;
    if(f==='unit') l.unit_cents=cents(inp.value);
    if(f==='cost') l.cost_cents=inp.value===''?null:cents(inp.value);
    if(f==='status') l.status=inp.value;
    if(f!=='desc'&&f!=='part_no') paintLines(canEdit); else paintTotals();
  }); });
  $$('#estRows [data-savetime]').forEach(function(btn){ btn.addEventListener('click', function(){
    var l=J.lines[+btn.dataset.savetime];
    if(!J.booking.vehicle) return toast('Add the vehicle on the Job tab first', true);
    api('/admin/guide/job/'+encodeURIComponent(l.guide_id)+'/save-vehicle-time',{method:'POST',body:{vehicle:J.booking.vehicle,labor_hours:l.qty}})
      .then(function(r){ toast('Saved '+l.qty+' hr for '+r.label); }).catch(function(e){ toast(e.message,true); });
  }); });
  $$('#estRows [data-del]').forEach(function(btn){ btn.addEventListener('click', function(){ J.lines.splice(+btn.dataset.del,1); paintLines(canEdit); }); });
  $$('#estRows [data-markup]').forEach(function(btn){ btn.addEventListener('click', function(){
    var l=J.lines[+btn.dataset.markup]; if(!l.cost_cents) return toast('Enter the part cost first', true);
    l.unit_cents=Math.round(l.cost_cents*(1+(Number(J.shop.parts_markup_pct)||0)/100)); paintLines(canEdit);
  }); });
  paintTotals();
}
function calcTotals(lines, keep){
  var t={labor:0,parts:0,fees:0,discount:0};
  lines.forEach(function(l){ if(!keep(l)) return; var a=Math.round((Number(l.qty)||0)*(Number(l.unit_cents)||0));
    if(l.type==='labor') t.labor+=a; else if(l.type==='part') t.parts+=a; else if(l.type==='fee') t.fees+=a; else t.discount+=a; });
  t.tax=Math.round(t.parts*(Number(J.shop.parts_tax_rate)||0)/100); t.total=Math.max(0,t.labor+t.parts+t.fees-t.discount)+t.tax;
  var cost=0, hasCost=false; lines.forEach(function(l){ if(keep(l)&&l.type==='part'&&l.cost_cents!=null){ cost+=Math.round((Number(l.qty)||0)*l.cost_cents); hasCost=true; } });
  t.partsProfit=hasCost?t.parts-cost:null; return t;
}
function paintTotals(){
  var q=calcTotals(J.lines,function(l){ return l.status!=='declined'; }), a=calcTotals(J.lines,function(l){ return l.type==='discount'||l.status==='approved'; });
  var tbl=function(t,title){ return '<div class="steel panel"><h3>'+title+'</h3><table><tr><td>Labor</td><td style="text-align:right">'+usd(t.labor)+'</td></tr><tr><td>Parts</td><td style="text-align:right">'+usd(t.parts)+'</td></tr>'+
    (t.fees?'<tr><td>Fees</td><td style="text-align:right">'+usd(t.fees)+'</td></tr>':'')+(t.discount?'<tr><td>Discounts</td><td style="text-align:right">−'+usd(t.discount)+'</td></tr>':'')+
    '<tr><td>Tax on parts ('+(J.shop.parts_tax_rate||0)+'%)</td><td style="text-align:right">'+usd(t.tax)+'</td></tr><tr class="big"><td>Total</td><td style="text-align:right">'+usd(t.total)+'</td></tr>'+
    (DESK()&&t.partsProfit!=null?'<tr><td class="dim" style="font-size:.82rem">Parts profit (staff only)</td><td class="dim" style="text-align:right;font-size:.82rem">'+usd(t.partsProfit)+'</td></tr>':'')+'</table></div>'; };
  $('#estTotals').innerHTML=tbl(q,'Quoted (not declined)')+tbl(a,'Approved so far');
}
function saveEstimate(){
  var bad=J.lines.filter(function(l){ return !String(l.desc||'').trim(); });

function jobVersions(k, tpls){

}

  });
}

/* ───────── LABOR & PARTS GUIDE ───────── */
var META=null;
function loadMeta(){ return META?Promise.resolve(META):api('/admin/meta').then(function(m){ META=m; return m; }); }
function guideToLines(r, rate, markup){
  var lines=[];
  if(r.flat_cents!=null) lines.push({type:'fee',desc:r.name,qty:1,unit_cents:r.flat_cents,status:'pending',guide_id:r.id});
  else if(r.labor_hours>0) lines.push({type:'labor',desc:r.name+' (labor)',qty:r.labor_hours,unit_cents:rate||0,status:'pending',guide_id:r.id});
  (r.parts||[]).forEach(function(p){ lines.push({type:'part',desc:p.name,part_no:p.part_no||null,qty:Number(p.qty)||1,cost_cents:p.cost_cents||0,
    unit_cents:Math.round((p.cost_cents||0)*(1+(Number(markup)||0)/100)),status:'pending',guide_id:r.id}); });
  return lines;
}
function guideRow(r, rate, markup, opts){
  opts=opts||{};
  var partsCost=(r.parts||[]).reduce(function(a,p){ return a+(p.cost_cents||0)*(Number(p.qty)||1); },0);
  var partsPrice=Math.round(partsCost*(1+(Number(markup)||0)/100));
  var labor=r.flat_cents!=null?r.flat_cents:Math.round(r.labor_hours*(rate||0));
  var h=r.history||{};
  var hist=h.vehicle_times_quoted?'Quoted '+h.vehicle_times_quoted+'× on this make/model, avg '+h.vehicle_avg_hours+' hr':(h.times_quoted?'Quoted '+h.times_quoted+'× before, avg '+h.avg_hours+' hr':'');
  return '<div class="gres"><div><h4>'+esc(r.name)+'</h4>'+
    '<div class="meta">'+(r.flat_cents!=null?'Flat '+usd(r.flat_cents):'<b style="color:var(--text)">'+r.labor_hours+' hr</b>')+
      (r.source==='vehicle'?' <span class="chip good">'+esc(r.override_label)+' time</span>':' <span class="chip">Standard time</span>')+
      ((r.parts||[]).length?' &middot; '+r.parts.length+' part'+(r.parts.length>1?'s':'')+', est. cost '+usd(partsCost):'')+'</div>'+
    ((r.parts||[]).length?'<div class="meta">Parts costs are estimates. '+partLinks(r.parts[0].name, opts.vehicleText)+'</div>':'')+
    (hist?'<div class="meta">'+esc(hist)+'</div>':'')+(r.notes?'<div class="meta" style="color:var(--warn)">'+esc(r.notes)+'</div>':'')+
    '<div class="gbt" data-gbt="'+esc(r.id)+'"></div></div>'+
    '<div class="gacts"><div class="price">'+usd(labor+partsPrice)+'</div><div class="meta" style="text-align:right">before tax</div>'+
      '<button type="button" class="btn sm" data-gadd="'+esc(r.id)+'">Add</button>'+
      (opts.bookTimes&&r.flat_cents==null?'<button type="button" class="btn ghost sm" data-gbook="'+esc(r.id)+'">Book time</button>':'')+'</div></div>';
}
function bookTimeHtml(bt, r){
  var h='<div class="btbox"><div class="bthead">Book time for <b>'+esc(bt.vehicle)+'</b>'+(bt.served_as?' <span class="chip warn">Matched as '+esc(bt.served_as)+'. Confirm engine.</span>':'')+'</div>';
  if(!bt.matches.length){
    return h+'<div class="meta">No book time matches “'+esc(bt.job)+'” for this vehicle'+(bt.engines.length?' ('+esc(bt.engines.join(', '))+')':'')+'. Use the standard time or type the hours.</div></div>';
  }
  h+=bt.matches.map(function(m,i){
    return '<div class="btrow"><div><b>'+m.hours+' hr</b> · '+esc(m.job)+'<div class="meta">'+esc(m.engine||'All engines')+
      (m.engine_match?' <span class="chip good">Engine match</span>':'')+(m.confidence?' <span class="chip">'+esc(m.confidence)+'</span>':'')+
      (m.check?' <span class="chip warn">Double-check before quoting</span>':'')+'</div></div>'+
      '<div class="row" style="gap:.35rem;flex-wrap:nowrap"><button type="button" class="btn sm" data-btuse="'+i+'">Use</button><button type="button" class="btn ghost sm" data-btuse="'+i+'" data-save="1">Use + save</button></div></div>';
  }).join('');
  h+='<div class="meta">From Open Labor Project'+(bt.cached?' (saved lookup)':'')+(bt.lookups_left!=null?' · '+bt.lookups_left+' lookups left today':'')+'. Times over 3 hours or marked low-confidence need a check.</div></div>';
  return h;

function guidePicker(el, opts){
  // opts: vehicle (string), onAdd(lines, result), rate, markup
  el.innerHTML='<div class="gpick"><div class="row"><input class="gq" placeholder="Search a job or part: starter, brakes, water pump…" style="flex:1;min-width:200px"><button type="button" class="btn ghost sm gclose">Close</button></div>'+
    '<div class="help gveh"></div><div class="list"><div class="dim" style="padding:.6rem">Loading the guide…</div></div></div>';
  var q=el.querySelector('.gq'), list=el.querySelector('.list'), t, last=[];
  function load(){
    Promise.all([api('/admin/guide/lookup?vehicle='+encodeURIComponent(opts.vehicle()||'')+'&q='+encodeURIComponent(q.value)), loadMeta().catch(function(){ return {}; })]).then(function(all){
      var d=all[0], meta=all[1]||{};
      last=d.results; var v=d.vehicle;
      var rowOpts={bookTimes:!!meta.book_times, vehicleText:[v.year,v.make,v.model].filter(Boolean).join(' ')};
      el.querySelector('.gveh').innerHTML=v.make?'Times for <b style="color:var(--text)">'+esc([v.year,v.make,v.model].filter(Boolean).join(' '))+'</b>. Vehicle-specific times are used when saved.':'<span style="color:var(--warn)">Add the year, make, and model to see vehicle-specific times.</span>';
      list.innerHTML=d.results.length?d.results.map(function(r){ return guideRow(r, opts.rate, opts.markup, rowOpts); }).join(''):'<div class="dim" style="padding:.6rem">No guide entries match. Add one under Quotes & labor guide.</div>';
      $$('[data-gadd]', list).forEach(function(b){ b.addEventListener('click', function(){
        var r=last.filter(function(x){ return x.id===b.dataset.gadd; })[0]; if(!r) return;
        if(!opts.rate && r.flat_cents==null && r.labor_hours>0) toast('Labor rate is $0. Set it in Settings → Shop', true);
        opts.onAdd(guideToLines(r, opts.rate, opts.markup), r);
        b.textContent='Added ✓'; setTimeout(function(){ b.textContent='Add'; }, 1500);
      }); });
      $$('[data-gbook]', list).forEach(function(b){ b.addEventListener('click', function(){
        var r=last.filter(function(x){ return x.id===b.dataset.gbook; })[0]; if(!r) return;
        var box=list.querySelector('[data-gbt="'+r.id.replace(/"/g,'')+'"]');
        busy(b,true,'Looking up…');
        api('/admin/guide/booktime?vehicle='+encodeURIComponent(opts.vehicle()||'')+'&job='+encodeURIComponent(r.id)).then(function(bt){
          box.innerHTML=bookTimeHtml(bt, r);
          $$('[data-btuse]', box).forEach(function(u){ u.addEventListener('click', function(){
            var m=bt.matches[+u.dataset.btuse], save=u.dataset.save==='1';
            var lines=guideToLines(Object.assign({}, r, {labor_hours:m.hours}), opts.rate, opts.markup);
            opts.onAdd(lines, r);
            if(save) api('/admin/guide/job/'+encodeURIComponent(r.id)+'/save-vehicle-time',{method:'POST',body:{vehicle:opts.vehicle(),labor_hours:m.hours}})
              .then(function(x){ toast('Added and saved '+m.hours+' hr for '+x.label); }).catch(function(e){ toast('Added, but not saved: '+e.message, true); });
            else toast('Added '+m.hours+' hr book time');
          }); });
        }).catch(function(e){ box.innerHTML='<div class="err-text">'+esc(e.message)+'</div>'; }).then(function(){ busy(b,false); });
      }); });
    }).catch(function(e){ list.innerHTML='<div class="err-text">'+esc(e.message)+'</div>'; });
  }
  q.addEventListener('input', function(){ clearTimeout(t); t=setTimeout(load, 250); });
  q.addEventListener('keydown', function(e){ if(e.key==='Enter') e.preventDefault(); });
  el.querySelector('.gclose').addEventListener('click', function(){ el.innerHTML=''; if(opts.onClose) opts.onClose(); });
  load(); q.focus();
}
function quoteTotals(lines, taxRate){
  var t={labor:0,parts:0,fees:0,discount:0};
  lines.forEach(function(l){ var a=Math.round((Number(l.qty)||0)*(Number(l.unit_cents)||0));
    if(l.type==='labor') t.labor+=a; else if(l.type==='part') t.parts+=a; else if(l.type==='fee') t.fees+=a; else t.discount+=a; });
  t.tax=Math.round(t.parts*(Number(taxRate)||0)/100); t.total=Math.max(0,t.labor+t.parts+t.fees-t.discount)+t.tax; return t;
}

function promoGenerate(P){

function runBulk(action, payload, sel, btn, quiet){
  var ids=sel.map(function(m){ return m.id; }), out=$('#bOut'), chunks=[], all=[], stopped=null;

  var step=function(k){
    if(k>=chunks.length) return Promise.resolve();
    return api('/admin/members/bulk',{method:'POST',body:Object.assign({action:action,ids:chunks[k]},payload)}).then(function(r){
      all=all.concat(r.results); if(btn) btn.textContent='Working… '+Math.min(ids.length,all.length)+' of '+ids.length;
      if(r.stopped){ stopped=r.stopped; var byId={}; sel.forEach(function(m){ byId[m.id]=m; });
        chunks.slice(k+1).forEach(function(c){ c.forEach(function(id){ var m=byId[id]||{}; all.push({id:id,name:m.name||m.phone||'Customer',ok:false,msg:'Not sent: Textbelt limit reached'}); }); });
        return; }
      return step(k+1);
    });
  };
  return step(0).then(function(){
    busy(btn,false);
    var had=all.filter(function(r){ return r.already; }), ok=all.filter(function(r){ return r.ok&&!r.already; }), bad=all.filter(function(r){ return !r.ok; });

      '<div class="steel panel"><b class="plus">✓ '+ok.length+' '+label+'</b>'+(had.length?' <span class="dim">· '+had.length+' already had it</span>':'')+(bad.length?'<div style="margin-top:.5rem"><b class="minus">'+bad.length+' skipped</b><ul style="margin:.3rem 0 0 1rem;padding:0">'+bad.map(function(r){ return '<li>'+esc(r.name)+': <span class="dim">'+esc(r.msg||'error')+'</span></li>'; }).join('')+'</ul></div>':'')+'</div>';
    else if(out&&quiet) out.innerHTML+='<div class="dim" style="margin-top:.4rem">Notification texts: '+ok.length+' sent'+(bad.length?', '+bad.length+' skipped':'')+'.</div>';
    loadMembers();

S.books={preset:'month', from:null, to:null, sub:'summary', q:'', cat:''};
var BOOK_PRESETS=[['month','This month'],['last_month','Last month'],['quarter','This quarter'],['ytd','This year'],['last_year','Last year'],['custom','Custom']];
var BOOK_SUBS=[['summary','Summary'],['out','Money out'],['in','Money in'],['miles','Mileage'],['repeat','Repeating bills'],['setup','Setup']];
function bookRange(p){
  var t=todayIso(), y=+t.slice(0,4), mo=+t.slice(5,7), pad=function(x){ return String(x).padStart(2,'0'); };
  var last=function(yy,mm){ return new Date(Date.UTC(yy,mm,0)).getUTCDate(); };
  if(p==='last_month'){ var ly=mo===1?y-1:y, lm=mo===1?12:mo-1; return [ly+'-'+pad(lm)+'-01', ly+'-'+pad(lm)+'-'+pad(last(ly,lm))]; }
  if(p==='quarter'){ var qm=Math.floor((mo-1)/3)*3+1; return [y+'-'+pad(qm)+'-01', t]; }
  if(p==='ytd') return [y+'-01-01', t];
  if(p==='last_year') return [(y-1)+'-01-01', (y-1)+'-12-31'];
  return [t.slice(0,8)+'01', t];
}
function bookCat(cfg, kind, key){ var L=kind==='income'?cfg.income_categories:cfg.categories; for(var i=0;i<L.length;i++) if(L[i].key===key) return L[i]; return {key:key,name:key,group:kind==='income'?'income':'opex'}; }
function shortDay(iso){ var p=String(iso).split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).toLocaleDateString(undefined,{month:'short',day:'numeric',timeZone:'UTC'}); }
function monthLabel(ym){ var p=ym.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,1)).toLocaleDateString(undefined,{month:'short',timeZone:'UTC'}); }

function entrySheet(e, kind, o){
  o=o||{};
  var cfgP=o.cfg?Promise.resolve(o.cfg):S.bk&&S.bk.settings?Promise.resolve(S.bk.settings):api('/admin/books/settings').then(function(d){ if(d.setup_needed) throw new Error('Finish the Books setup first.'); return d.settings; });
  var jobsP=o.booking_id?Promise.resolve(null):(S.jobPick?Promise.resolve(S.jobPick):api('/admin/books/jobs').then(function(r){ S.jobPick=r.jobs; return r.jobs; }).catch(function(){ return []; }));
  Promise.all([cfgP,jobsP]).then(function(r){
    var cfg=r[0], jobs=r[1]||[];
    var d=$('#drawer'), sh=$('#sheet'); d.classList.remove('hide'); J=null;
    var finish=function(){ if(o.done){ S.jobPick=null; o.done(); } else closeDrawer(); };
    var st={kind:e?e.kind:(kind||'expense'), receipt:null, removeReceipt:false, job:o.booking_id||(e&&e.booking_id)||''};
    if(st.job&&!o.booking_id&&!jobs.some(function(j){ return j.id===st.job; })) jobs=[{id:st.job, order_name:e&&e.job_ref||'Linked job'}].concat(jobs);
    var draw=function(){
      var cats=st.kind==='income'?cfg.income_categories:cfg.categories, cur=e&&e.kind===st.kind?e.category:(st.kind==='expense'?(o.category||(st.job?'parts':'fuel')):'job_other');
      sh.innerHTML='<div class="row" style="justify-content:space-between"><h2 style="margin:0">'+(e?'Edit entry':st.kind==='income'?'Add income':o.booking_id?'Add job expense':'Add expense')+'</h2><button class="btn ghost sm" id="closeDrawer">'+(o.done?'‹ Back to job':'Close')+'</button></div>'+
        (o.booking_id?'<div class="chip gold" style="margin-top:.6rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">For job: '+esc(o.job_label||'')+'</div>':'')+
        '<form id="enForm" style="margin-top:1rem"><div class="seg sec kindseg"><button type="button" data-kind="expense" class="'+(st.kind==='expense'?'on':'')+'">Money out</button><button type="button" data-kind="income" class="'+(st.kind==='income'?'on':'')+'">Money in</button></div>'+
        '<div class="grid g2">'+fld('Amount ($)','amount',e&&e.kind===st.kind?dollars(e.amount_cents):'','','text','decimal')+fld('Date','entry_date',e?e.entry_date:todayIso(),'','date')+'</div>'+
        '<div class="field"><label>Category</label><select name="category">'+cats.map(function(c){ return '<option value="'+esc(c.key)+'"'+(c.key===cur?' selected':'')+'>'+esc(c.name)+'</option>'; }).join('')+'</select></div>'+
        '<div class="grid g2">'+fld(st.kind==='income'?'From (customer, company)':'Paid to (store, person)','vendor',e?e.vendor||'':(o.vendor||''))+
        '<div class="field"><label>'+(st.kind==='income'?'Paid by':'Paid with')+'</label><select name="method"><option value="">—</option>'+cfg.methods.map(function(m){ return '<option'+(e&&e.method===m?' selected':'')+'>'+esc(m)+'</option>'; }).join('')+'</select></div></div>'+
        fld('Note','description',e?e.description||'':'')+
        (o.booking_id?'':'<div class="field"><label>Job (optional)</label><select name="booking_id"><option value="">Not for a specific job</option>'+
          jobs.map(function(j){ var dt=j.paid_at?String(j.paid_at).slice(0,10):j.sched_date||String(j.created_at||'').slice(0,10);
            return '<option value="'+esc(j.id)+'"'+(j.id===st.job?' selected':'')+'>'+esc(jobLabel(j)+(dt?' · '+shortDay(dt):''))+'</option>'; }).join('')+'</select>'+
          '<div class="help">Pick the job to count this against its profit.</div></div>')+
        '<div class="field"><label>Receipt photo</label><div id="rcpt">'+(e&&e.has_receipt&&!st.removeReceipt?'<div class="row"><button type="button" class="btn ghost sm" id="rView">View receipt</button><button type="button" class="btn ghost sm" id="rDel">Remove</button></div>':'')+
          (st.receipt?'<img src="'+st.receipt+'" alt="Receipt" class="rimg">':'')+'<input type="file" accept="image/*" capture="environment" id="rFile" style="margin-top:.4rem"></div></div>'+
        (e||o.booking_id?'':'<label class="keep"><input type="checkbox" name="repeat"> Repeats every month on this day</label>')+
        (e&&e.recurring_id?'<p class="help">This came from a monthly bill. Editing it changes this month only. Manage the bill under Repeating bills.</p>':'')+
        '<div class="row" style="margin-top:.8rem"><button class="btn" id="enSave">Save</button>'+(e?'<button type="button" class="btn danger" id="enDel">Delete</button>':'')+'</div><div id="enOut" class="help"></div></form>';
      $('#closeDrawer').addEventListener('click', o.done?function(){ o.done(); }:closeDrawer);
      if(fe($('#enForm'),'booking_id')) fe($('#enForm'),'booking_id').addEventListener('change', function(){ st.job=this.value; });
      $$('[data-kind]').forEach(function(b){ b.addEventListener('click', function(){ if(st.kind!==b.dataset.kind){ st.kind=b.dataset.kind; draw(); } }); });
      $('#rFile').addEventListener('change', function(){ var file=this.files[0]; if(!file) return; shrinkPhoto(file).then(function(u){ st.receipt=u; st.removeReceipt=false; draw(); }).catch(function(err){ toast(err.message,true); }); });
      if($('#rView')) $('#rView').addEventListener('click', function(){ var b=this; busy(b,true,'Loading…');
        api('/admin/books/receipt/'+e.id).then(function(r){ busy(b,false); var w=window.open(''); if(w){ w.document.title='Receipt'; w.document.body.style.margin='0'; var im=w.document.createElement('img'); im.src=r.data; im.style.maxWidth='100%'; w.document.body.appendChild(im); } else { $('#rcpt').insertAdjacentHTML('afterbegin','<img src="'+r.data+'" class="rimg" alt="Receipt">'); } })
          .catch(function(err){ busy(b,false); toast(err.message,true); }); });
      if($('#rDel')) $('#rDel').addEventListener('click', function(){ st.removeReceipt=true; draw(); });
      if($('#enDel')) $('#enDel').addEventListener('click', function(){ if(!confirm('Delete this entry?')) return;
        api('/admin/books/entries/'+e.id,{method:'DELETE'}).then(function(){ toast('Deleted'); finish(); }).catch(function(err){ toast(err.message,true); }); });
      $('#enForm').addEventListener('submit', function(ev){ ev.preventDefault(); var f=ev.target, btn=$('#enSave');
        var body={kind:st.kind, amount:fe(f,'amount').value, entry_date:fe(f,'entry_date').value, category:fe(f,'category').value, vendor:fe(f,'vendor').value,
          method:fe(f,'method').value, description:fe(f,'description').value, booking_id:o.booking_id||st.job||null};
        if(st.receipt) body.receipt=st.receipt; else if(st.removeReceipt) body.remove_receipt=true;
        if(!e && fe(f,'repeat') && fe(f,'repeat').checked) body.repeat_monthly=true;
        busy(btn,true,'Saving…');
        api(e?'/admin/books/entries/'+e.id:'/admin/books/entries',{method:e?'PATCH':'POST',body:body})
          .then(function(){ toast(e?'Saved':(st.kind==='income'?'Income added':'Expense added')); finish(); })
          .catch(function(err){ busy(btn,false); $('#enOut').innerHTML='<span class="minus">'+esc(err.message)+'</span>'; });
      });
    };
    draw();
    var a=$('#enForm [name="amount"]'); if(a&&!e) a.focus();
  }).catch(function(err){ toast(err.message,true); });
}

  api('/admin/settings').then(function(d){ S.settings=JSON.parse(JSON.stringify(d.config)); S.defaults=d.defaults; S.windows=S.settings.time_windows; renderSettings(); }).catch(fail);
};
function renderSettings(){
  var c=S.settings;
  function num(name,label,val,help,step){ return '<div class="field"><label>'+label+'</label><input data-k="'+name+'" type="number" step="'+(step||'1')+'" value="'+esc(val)+'">'+(help?'<div class="help">'+help+'</div>':'')+'</div>'; }

    '<label class="row" style="color:var(--text);font-family:var(--body)"><input type="checkbox" data-k="reply_alerts"'+(c.reply_alerts!==false?' checked':'')+'> Text my cell when a customer replies to a text</label>'+

  $$('[data-k]').forEach(function(inp){ inp.addEventListener('change', function(){
    var k=inp.dataset.k, v=inp.value;
    if(k==='tech_can_estimate') c.tech_can_estimate=inp.checked;
    else if(k==='reminders_auto') c.reminders_auto=inp.checked;
    else if(k==='reply_alerts') c.reply_alerts=inp.checked;
    else if(k==='labor_rate') c.labor_rate_cents=cents(v);
    else if(k==='referral_min_dollars') c.referral_min_cents=cents(v);
    else if(k==='time_windows'||k==='payment_methods') c[k]=v.split(',').map(function(x){return x.trim();}).filter(Boolean);
    else if(k==='terms_extra') c.terms_extra=v.split('\n').map(function(x){return x.trim();}).filter(Boolean);
    else if(['shop_phone','payment_link','notify_phone','google_review_url'].indexOf(k)>-1) c[k]=v.trim();
    else c[k]=parseFloat(v);
  }); });
  $$('[data-tpl]').forEach(function(ta){ ta.addEventListener('change', function(){ c.sms_templates=c.sms_templates||{}; c.sms_templates[ta.dataset.tpl]=ta.value; }); });
  $$('[data-day]').forEach(function(cb){ cb.addEventListener('change', function(){ c.offpeak_days=$$('[data-day]').filter(function(x){return x.checked;}).map(function(x){return +x.dataset.day;}); }); });
  $$('[data-t]').forEach(function(inp){ inp.addEventListener('change', function(){ var t=c.tiers[inp.dataset.t], f=inp.dataset.f;
    if(f==='min') t.min_spend_cents=cents(inp.value); else if(f==='multiplier') t.multiplier=parseFloat(inp.value); else if(f==='perks') t.perks=inp.value.split('\n').map(function(s){return s.trim();}).filter(Boolean); else t.name=inp.value.trim(); }); });
  $$('[data-r]').forEach(function(inp){ inp.addEventListener('change', function(){ var r=c.rewards[inp.dataset.r], f=inp.dataset.f;
    if(f==='active') r.active=inp.checked; else if(f==='points') r.points=parseInt(inp.value,10); else if(f==='value') r.value_cents=cents(inp.value); else if(f==='min') r.min_invoice_cents=cents(inp.value); else r[f]=inp.value.trim(); }); });
  $$('[data-deltier]').forEach(function(b){ b.addEventListener('click', function(){ c.tiers.splice(+b.dataset.deltier,1); renderSettings(); }); });
  $$('[data-delrew]').forEach(function(b){ b.addEventListener('click', function(){ c.rewards.splice(+b.dataset.delrew,1); renderSettings(); }); });
  $('#addTier').addEventListener('click', function(){ c.tiers.push({key:'tier'+Date.now().toString(36),name:'New tier',min_spend_cents:0,multiplier:1,perks:[]}); renderSettings(); });
  $('#addRew').addEventListener('click', function(){ c.rewards.push({key:'r'+Date.now().toString(36),name:'New reward',points:1000,value_cents:2500,min_invoice_cents:0,active:false,description:''}); renderSettings(); });
  $('#impGo').addEventListener('click', function(){
    var btn=this, raw=$('#impTxt').value.trim(), data;
    try{ data=JSON.parse(raw.slice(raw.indexOf('{'))); }catch(e){ return toast('That isn\'t the Shopify orders page. Copy the whole page and try again.', true); }
    busy(btn,true,'Importing…');
    api('/admin/import/shopify',{method:'POST',body:{orders:data.orders||data,include_past:$('#impPast').checked}}).then(function(r){
      busy(btn,false);
      var parts=[r.created+' added'];
      if(r.already) parts.push(r.already+' already in the desk');
      if(r.past) parts.push(r.past+' skipped (date already passed)');
      if(r.cancelled) parts.push(r.cancelled+' cancelled');
      if(r.not_booking) parts.push(r.not_booking+' not bookings');
      if(r.failed) parts.push(r.failed+' failed: '+r.errors.join('; '));
      $('#impOut').textContent=parts.join(' · ');
      toast(r.created?r.created+' bookings added to Jobs':'No new bookings to add');
      $('#impTxt').value='';
    }).catch(function(e){ busy(btn,false); toast(e.message,true); });
  });
  $('#resetSet').addEventListener('click', function(){ if(confirm('Replace everything here with the recommended defaults? Nothing is saved until you press Save.')){ S.settings=JSON.parse(JSON.stringify(S.defaults)); renderSettings(); } });
  $('#saveSet').addEventListener('click', function(){ c.tiers.sort(function(a,b){ return a.min_spend_cents-b.min_spend_cents; });
    api('/admin/settings',{method:'PUT',body:{config:c}}).then(function(d){ S.settings=d.config; S.windows=d.config.time_windows; toast('Settings saved'); renderSettings(); }).catch(function(e){ toast(e.message,true); }); });
}

var SUPPLIERS=[
  ['oreilly',"O'Reilly",function(q){ return 'https://www.oreillyauto.com/search?q='+q; }],
  ['autozone','AutoZone',function(q){ return 'https://www.autozone.com/searchresult?searchText='+q; }],
  ['advance','Advance',function(q){ return 'https://shop.advanceautoparts.com/web/SearchResults?searchTerm='+q; }],
  ['napa','NAPA',function(q){ return 'https://www.napaonline.com/search?text='+q; }],
  ['amazon','Amazon',function(q){ return 'https://www.amazon.com/s?k='+q+'&i=automotive'; }],
  ['partsgeek','PartsGeek',function(q){ return 'https://www.partsgeek.com/ss/?ssq='+q; }],
  ['apremium','A-Premium',function(q){ return 'https://www.a-premium.com/search?q='+q; }]
];
function supplierName(k){ for(var i=0;i<SUPPLIERS.length;i++) if(SUPPLIERS[i][0]===k) return SUPPLIERS[i][1]; return k||''; }
function partLinks(name, vehicle){
  var q=encodeURIComponent(((vehicle||'')+' '+(name||'')).trim());
  return '<span class="plinks">Check price: '+SUPPLIERS.slice(0,4).map(function(s){ return '<a href="'+s[2](q)+'" target="_blank" rel="noopener">'+esc(s[1])+'</a>'; }).join(' · ')+'</span>';
}
// Side-by-side price check for one part: opens each supplier's search for this vehicle, then records the price you pick.

  var q=encodeURIComponent(((opts.vehicle||'')+' '+(opts.part||'')+(opts.partNo?' '+opts.partNo:'')).trim());

  });
}

/* ───────── PHOTOS ───────── */
// Shrinks a phone photo to 1280px JPEG before upload so inspections stay fast on cell data.
function shrinkPhoto(file){
  return new Promise(function(resolve, reject){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){ var max=1280, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1, max/Math.max(w,h));
      var cv=document.createElement('canvas'); cv.width=Math.round(w*k); cv.height=Math.round(h*k);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url); resolve(cv.toDataURL('image/jpeg',0.72)); };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('That file isn\'t a photo.')); };
    img.src=url;
  });
}

/* ───────── INSPECTION TAB ───────── */
function tabInspection(){
  var b=J.booking;
  $('#dbody').innerHTML='<div class="empty">Loading inspection…</div>';
  api('/admin/booking/'+b.id+'/inspection').then(function(d){
    var I=d.inspection, photos=d.photos, items=I.items||[], saveT;
    var token=(d.report_link.match(/\/i\/([a-f0-9]+)/)||[])[1];
    function photoUrl(p){ return API+'/i/'+token+'/p/'+p.id; }
    function counts(){ var c={good:0,watch:0,bad:0,done:0}; items.forEach(function(i){ if(i.status){ c.done++; if(c[i.status]!=null) c[i.status]++; } }); return c; }
    function save(now){ clearTimeout(saveT); saveT=setTimeout(function(){
      api('/admin/booking/'+b.id+'/inspection',{method:'PUT',body:{items:items,summary:$('#insSum').value}}).then(function(){ $('#insSaved').textContent='Saved'; }).catch(function(e){ toast(e.message,true); });
    }, now?0:600); $('#insSaved').textContent='Saving…'; }
    function paint(){
      var c=counts();
      $('#dbody').innerHTML='<div class="steel panel sec"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">Vehicle inspection</h3>'+
          '<div class="help">'+c.done+' of '+items.length+' checked · <span style="color:var(--bad)">'+c.bad+' need attention</span> · <span style="color:var(--warn)">'+c.watch+' to watch</span> · <span style="color:var(--good)">'+c.good+' good</span> · <span id="insSaved"></span></div></div>'+
          '<div class="row" style="gap:.35rem"><a class="btn ghost sm" href="'+esc(d.report_link)+'" target="_blank" rel="noopener">Preview report</a>'+
          '<button class="btn purple sm" id="insSend"'+(b.phone?'':' disabled title="No phone on this job"')+'>Text report</button></div></div></div>'+
        '<div class="steel panel sec">'+items.map(function(it,i){
          var pics=photos.filter(function(p){ return p.item_key===it.key; });
          return '<div class="insrow"><div class="insname">'+esc(it.name)+'</div>'+
            '<div class="seg" role="group" aria-label="'+esc(it.name)+'">'+[['good','Good'],['watch','Watch'],['bad','Needs work'],['na','N/A']].map(function(s){
              return '<button type="button" class="'+s[0]+(it.status===s[0]?' on':'')+'" data-ist="'+i+'" data-v="'+s[0]+'">'+s[1]+'</button>'; }).join('')+'</div>'+
            '<input class="insnote" data-inote="'+i+'" value="'+esc(it.note||'')+'" placeholder="Note (what you saw, measurements)">'+
            '<div class="insph">'+pics.map(function(p){ return '<span class="ph"><img src="'+photoUrl(p)+'" alt=""><button type="button" data-pdel="'+p.id+'" aria-label="Delete photo">×</button></span>'; }).join('')+
              '<label class="btn ghost sm addph">+ Photo<input type="file" accept="image/*" capture="environment" data-padd="'+esc(it.key)+'" hidden></label></div></div>';
        }).join('')+'</div>'+
        '<div class="steel panel sec"><div class="field"><label>Summary for the customer</label><textarea id="insSum" rows="3" placeholder="Overall condition, what to fix now, what can wait">'+esc(I.summary||'')+'</textarea></div>'+
          '<button class="btn sm" id="insToEst"'+(c.bad+c.watch?'':' disabled')+'>Add "needs work" items to the estimate</button></div>';
      $$('[data-ist]').forEach(function(btn){ btn.addEventListener('click', function(){ var it=items[+btn.dataset.ist]; it.status=it.status===btn.dataset.v?null:btn.dataset.v; paint(); save(); }); });
      $$('[data-inote]').forEach(function(inp){ inp.addEventListener('input', function(){ items[+inp.dataset.inote].note=inp.value; save(); }); });
      $('#insSum').addEventListener('input', function(){ save(); });
      $$('[data-padd]').forEach(function(inp){ inp.addEventListener('change', function(){
        var f=inp.files&&inp.files[0]; if(!f) return; toast('Uploading photo…');
        shrinkPhoto(f).then(function(data){ return api('/admin/booking/'+b.id+'/inspection/photo',{method:'POST',body:{item_key:inp.dataset.padd,data:data}}); })
          .then(function(r){ photos.push(r.photo); paint(); toast('Photo added'); }).catch(function(e){ toast(e.message,true); });
      }); });
      $$('[data-pdel]').forEach(function(btn){ btn.addEventListener('click', function(){
        if(!confirm('Delete this photo?')) return;
        api('/admin/inspection-photo/'+btn.dataset.pdel,{method:'DELETE'}).then(function(){ photos=photos.filter(function(p){ return p.id!==btn.dataset.pdel; }); paint(); }).catch(function(e){ toast(e.message,true); });
      }); });
      $('#insSend').addEventListener('click', function(){ var btn=this; busy(btn,true,'Sending…');
        api('/admin/booking/'+b.id+'/inspection',{method:'PUT',body:{items:items,summary:$('#insSum').value}})
          .then(function(){ return api('/admin/booking/'+b.id+'/inspection/send',{method:'POST',body:{via:'sms'}}); })
          .then(function(){ toast('Inspection report texted'); busy(btn,false); }).catch(function(e){ toast(e.message,true); busy(btn,false); }); });
      $('#insToEst').addEventListener('click', function(){
        var est=JSON.parse(JSON.stringify(b.estimate||{lines:[],notes:''})); est.lines=est.lines||[];
        var have=est.lines.map(function(l){ return l.desc; }), added=0;
        items.filter(function(i){ return i.status==='bad'||i.status==='watch'; }).forEach(function(i){
          var desc=i.name+(i.note?' – '+i.note:''); if(have.indexOf(desc)>-1) return;
          est.lines.push({type:'labor',desc:desc.slice(0,200),qty:1,unit_cents:J.shop.labor_rate_cents||0,status:'pending'}); added++; });
        if(!added) return toast('Those items are already on the estimate');
        api('/admin/booking/'+b.id+'/estimate',{method:'PUT',body:{lines:est.lines,notes:est.notes||''}})
          .then(function(){ toast(added+' item'+(added>1?'s':'')+' added. Set the hours and parts on the estimate.'); openJob(b.id,'estimate'); }).catch(function(e){ toast(e.message,true); });
      });
    }
    paint();
  }).catch(function(e){ $('#dbody').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
}

function invoicePanel(){
